<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description"><title id="title">Снимката още не е включена</title><desc id="description">Работен демо запис. Няма изображение на действителния автомобил; вижте оригиналната обява.</desc><rect width="1200" height="800" fill="#f1f3f5"/><g fill="#343a40" text-anchor="middle" font-family="sans-serif"><text x="600" y="378" font-size="36">Снимката още не е включена</text><text x="600" y="432" font-size="24">Вижте автомобила в оригиналната обява</text></g></svg>
