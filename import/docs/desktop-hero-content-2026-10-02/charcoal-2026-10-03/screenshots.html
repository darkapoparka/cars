<!doctype html>
<html lang="en">
	<meta charset="utf-8" /><meta
		name="viewport"
		content="width=device-width,initial-scale=1"
	/><title>Cars — charcoal frames and cleaner mode tabs</title>
	<style>
		body {
			margin: 0;
			background: #f6f6f7;
			color: #17191c;
			font:
				16px/1.5 system-ui,
				sans-serif;
		}
		main {
			max-width: 1600px;
			margin: auto;
			padding: 32px;
		}
		h1 {
			font-size: 28px;
			margin: 0 0 8px;
		}
		p {
			margin: 0;
			color: #66676b;
		}
		nav {
			display: flex;
			align-items: center;
			gap: 16px;
			flex-wrap: wrap;
			margin: 24px 0;
		}
		label {
			display: flex;
			align-items: center;
			gap: 8px;
		}
		select {
			min-height: 44px;
			padding: 8px 16px;
			border: 1px solid #c8c8cd;
			border-radius: 12px;
			background: white;
			color: #17191c;
			font: inherit;
		}
		.pair {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 20px;
		}
		figure {
			margin: 0;
			min-width: 0;
		}
		figcaption {
			margin: 0 0 8px;
		}
		img {
			display: block;
			width: 100%;
			height: auto;
			border: 1px solid #e5e5e7;
			border-radius: 16px;
			box-sizing: border-box;
		}
		a {
			color: inherit;
		}
		.links {
			display: flex;
			gap: 20px;
			flex-wrap: wrap;
			margin-top: 24px;
		}
		a:focus-visible,
		select:focus-visible {
			outline: 3px solid #b9161c;
			outline-offset: 3px;
		}
		@media (max-width: 900px) {
			.pair {
				grid-template-columns: 1fr;
			}
			main {
				padding: 16px;
			}
		}
	</style>
	<main>
		<h1>Charcoal frames and cleaner mode tabs</h1>
		<p>
			Implemented in the shared desktop theme and components. Light fields, red actions and the
			automotive layout are preserved.
		</p>
		<nav>
			<label
				>Page / mode
				<select id="page">
					<option value="home">Home · Buy</option>
					<option value="home-finance">Home · Leasing</option>
					<option value="home-sell">Home · Sell</option>
					<option value="home-import">Home · Import</option>
					<option value="inventory">Inventory</option>
					<option value="services">Services</option>
					<option value="about">About</option>
					<option value="contact">Contact</option>
				</select></label
			><label
				>Language
				<select id="locale">
					<option value="bg">Bulgarian</option>
					<option value="en">English</option>
				</select></label
			>
		</nav>
		<div class="pair">
			<figure>
				<figcaption>Before</figcaption>
				<a id="before-link" href="before/home-bg-1440.png"
					><img
						id="before"
						src="before/home-bg-1440.png"
						width="1440"
						height="1000"
						alt="Home Buy before"
				/></a>
			</figure>
			<figure>
				<figcaption>After</figcaption>
				<a id="after-link" href="after/home-bg-1440.png"
					><img
						id="after"
						src="after/home-bg-1440.png"
						width="1440"
						height="1000"
						alt="Home Buy after"
				/></a>
			</figure>
		</div>
		<div class="links">
			<a href="README.md">QA receipt</a><a href="http://127.0.0.1:6790/bg">Live Home</a
			><a href="verification.json">Verification details</a>
		</div>
	</main>
	<script>
		const page = document.querySelector('#page'),
			locale = document.querySelector('#locale');
		function update() {
			for (const phase of ['before', 'after']) {
				const path = phase + '/' + page.value + '-' + locale.value + '-1440.png';
				const image = document.querySelector('#' + phase);
				image.src = path;
				image.alt =
					page.selectedOptions[0].text + ' ' + locale.selectedOptions[0].text + ' ' + phase;
				document.querySelector('#' + phase + '-link').href = path;
			}
		}
		page.addEventListener('change', update);
		locale.addEventListener('change', update);
	</script>
</html>
