name: App quality
on:
  push:
    branches: [main]
    paths:
      - 'templates/app/**'
      - '.github/workflows/app-quality.yml'
  pull_request:
    paths:
      - 'templates/app/**'
      - '.github/workflows/app-quality.yml'
permissions:
  contents: read
concurrency:
  group: cars-app-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: templates/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: templates/app
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: templates/app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Production routes in both journeys
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 6473 > /tmp/cars-app-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --location http://127.0.0.1:6473/ > /dev/null; then break; fi
            sleep 1
          done
          if ! npm run qa:routes; then
            cat /tmp/cars-app-preview.log
            exit 1
          fi
