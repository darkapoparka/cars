name: Existing fleet hosted native QA
on:
  workflow_dispatch:
    inputs:
      request:
        description: Reviewed Priselci request basename
        type: choice
        options: [priselci-request.json]
        default: priselci-request.json
        required: true
      request_sha256:
        description: Raw SHA256 of the reviewed request JSON
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: cars-priselci-hosted-native-qa
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/cars-hosted-native-browsers
      QA_REQUEST: ${{ inputs.request }}
      QA_REQUEST_SHA256: ${{ inputs.request_sha256 }}
    steps:
      - name: Check out immutable QA tools and original proof inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/workflows/existing-fleet-hosted-native-qa.yml
            /docs/releases/**/*.json
            /templates/auto-best/
            /templates/modern/
            /templates/import/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Verify QA authority and result parsing contracts
        run: node --test scripts/verify-existing-fleet-hosted-native.test.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install lockfile-pinned Auto Best and Modern QA dependencies
        run: |
          echo "CARS_QA_NODE22=$(command -v node)" >> "$GITHUB_ENV"
          npm ci --ignore-scripts --prefix templates/auto-best
          npm install --global --ignore-scripts pnpm@11.4.0
          pnpm --dir templates/modern install --frozen-lockfile --ignore-scripts
          node templates/auto-best/node_modules/playwright/cli.js install --with-deps chrome
          pnpm --dir templates/modern --filter e2e exec playwright install --with-deps chromium
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install lockfile-pinned Import QA dependencies
        run: |
          echo "CARS_QA_NODE24=$(command -v node)" >> "$GITHUB_ENV"
          npm ci --ignore-scripts --prefix templates/import
          node templates/import/node_modules/@playwright/test/cli.js install --with-deps chromium
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Verify exact deployment pins and collect existing native browser checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-existing-fleet-hosted-native.mjs --request "$QA_REQUEST" --sha256 "$QA_REQUEST_SHA256" --run
      - name: Retain compact honest QA evidence and bounded failure captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: existing-hosted-native-priselci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cars-hosted-native-qa/${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
