name: Dealer public source preparation
on:
  push:
    branches: [astra/source-prep]
    paths:
      - .github/workflows/dealer-pack-source-prep.yml
      - scripts/collect-dealer-pack-source.mjs
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /dealers/
            /docs/**/*.json
            /docs/**/*.md
            /leads/expansion-2026-10-18/
            /templates.lock.json
            /workspace.json
            /catalog.json
            /clients/index.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - run: npm install --prefix runtime/source-prep-tools --ignore-scripts --no-audit --no-fund --save-exact sharp@0.35.5
      - name: Retain exact source inputs and public evidence; no ledger or provider writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-dealer-pack-source.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: public-dealer-source--${{ github.run_id }}
          path: |
            runtime/public-source-preparation/*.json
            runtime/public-source-preparation/*.tgz
            runtime/public-source-preparation/public/
          retention-days: 3
          if-no-files-found: error
