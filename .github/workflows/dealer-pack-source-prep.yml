name: Dealer public source preparation
on:
  push:
    branches: [astra/source-prep]
    paths:
      - .github/workflows/dealer-pack-source-prep.yml
      - scripts/collect-dealer-pack-source.mjs
      - scripts/collect-public-marketplace-candidates.mjs
      - scripts/prepare-selected-public-packs.mjs
      - scripts/dealer-pack-public-matte.patch
      - scripts/dealer-pack-public-matte.test.mjs
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CARS_DEALER_PACK_TOOL_PACKAGE: ${{ github.workspace }}/runtime/source-prep-tools/package.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /dealers/
            /docs/**/*.json
            /docs/**/*.md
            /leads/expansion-2026-10-18/
            /templates.lock.json
            /workspace.json
            /catalog.json
            /clients/index.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - run: npm install --prefix runtime/source-prep-tools --ignore-scripts --no-audit --no-fund --save-exact sharp@0.35.5
      - name: Retain exact source inputs and public evidence; no ledger or provider writes
        id: source_inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect-dealer-pack-source.mjs
      - name: Verify explicit original-canvas treatment without changing existing raster gates
        run: |
          git apply --check scripts/dealer-pack-public-matte.patch
          git apply scripts/dealer-pack-public-matte.patch
          node --test scripts/prepare-dealer-pack-logo.test.mjs scripts/dealer-pack-public-matte.test.mjs
      - name: Prepare only Drive Direct and Midwest; store qualified immutable blobs, never refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-selected-public-packs.mjs
      - name: Collect other exact waiting marketplace source candidates without review flags
        if: ${{ !cancelled() && steps.source_inputs.conclusion == 'success' }}
        run: node scripts/collect-public-marketplace-candidates.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: public-dealer-source--${{ github.run_id }}
          path: |
            runtime/public-source-preparation/*.json
            runtime/public-source-preparation/*.tgz
            runtime/public-source-preparation/public/
            runtime/public-prepared-packs/*.json
            runtime/public-prepared-packs/*.png
            runtime/public-marketplace-candidates/
          retention-days: 3
          if-no-files-found: error
