name: Adopt dealer native EN/BG localization

on:
  workflow_call:
    inputs:
      dealer_slug:
        description: Canonical dealer slug
        required: true
        type: string
      dealer_repository:
        description: Exact owner/repository publication identity
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: adopt-native-localization-${{ inputs.dealer_slug }}
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DEALER_SLUG: ${{ inputs.dealer_slug }}
      DEALER_REPOSITORY: ${{ inputs.dealer_repository }}
      EXPECTED_AUTO_BEST: a5f3684483a509e556a5912a8d2c7b8ed03f9c5b
      EXPECTED_MODERN: e8c1bca793b6350948f0a1b44d6e50b661ac0111
      EXPECTED_IMPORT: 3db790795ade0d645348de71f510fb40ee427c28
      EXPECTED_CARWOW: 42970ab5724cb32da17e75879a2fca470629aebe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture immutable dealer source
        shell: bash
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24.8.0'

      - name: Await exact reviewed Cars releases
        shell: bash
        run: |
          set -euo pipefail
          CARS="$RUNNER_TEMP/cars"
          rm -rf "$CARS"
          git clone --no-tags --filter=blob:none --no-checkout https://github.com/darkapoparka/cars.git "$CARS"
          git -C "$CARS" sparse-checkout init --no-cone
          cat > "$CARS/.git/info/sparse-checkout" <<'EOF'
          /scripts/
          /templates/
          /docs/
          /*.json
          EOF
          ready=false
          for attempt in $(seq 1 40); do
            git -C "$CARS" fetch origin main
            git -C "$CARS" checkout --detach origin/main
            if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cars/templates.lock.json', 'utf8'));
          const expected = {
            'auto-best': process.env.EXPECTED_AUTO_BEST,
            modern: process.env.EXPECTED_MODERN,
            import: process.env.EXPECTED_IMPORT,
            carwow: process.env.EXPECTED_CARWOW
          };
          for (const [key, commit] of Object.entries(expected)) {
            if (lock.templates?.[key]?.commit !== commit) process.exit(1);
            if (lock.templates?.[key]?.qa?.nativeLocalization?.commit !== commit) process.exit(1);
          }
          NODE
            then
              echo "CARS_SHA=$(git -C "$CARS" rev-parse HEAD)" >> "$GITHUB_ENV"
              ready=true
              break
            fi
            sleep 30
          done
          test "$ready" = true || { echo 'Reviewed Cars releases were not promoted in time' >&2; exit 1; }

      - name: Generate exact localized dealer package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/localized"
          node "$RUNNER_TEMP/cars/scripts/rollout-localized-client.mjs" \
            --client-root "$GITHUB_WORKSPACE" \
            --slug "$DEALER_SLUG" \
            --repository "$DEALER_REPOSITORY" \
            --output "$RUNNER_TEMP/localized" \
            | tee "$RUNNER_TEMP/localization-rollout-report.json"

      - name: Validate native contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.env.RUNNER_TEMP + '/localized';
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'dealer.json'), 'utf8'));
          const contract = JSON.parse(fs.readFileSync(path.join(root, 'localization/contract.json'), 'utf8'));
          const adoption = JSON.parse(fs.readFileSync(path.join(root, 'localization/adoption.json'), 'utf8'));
          if (manifest.packaging?.version !== '2') throw new Error('Expected packaging v2');
          if (manifest.repository !== process.env.DEALER_REPOSITORY) throw new Error('Repository identity changed');
          if (JSON.stringify([...contract.enabledLocales].sort()) !== '["bg","en"]') throw new Error('Expected complete EN/BG contract');
          if (adoption.dealerId !== contract.dealerId || adoption.packagingVersion !== '2') throw new Error('Invalid native adoption seal');
          for (const variant of manifest.variants) {
            if (manifest.templateRevisions?.[variant.key] !== adoption.releases?.[variant.key]?.commit) {
              throw new Error(`Unsealed template revision: ${variant.key}`);
            }
          }
          NODE

      - name: Install and publish guarded source update
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA" || { echo 'Dealer main changed during generation' >&2; exit 1; }
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$RUNNER_TEMP/localized/" "$GITHUB_WORKSPACE/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Dealer already matches the reviewed localized package.'
            exit 0
          fi
          git commit -m 'Adopt native EN/BG localization' -m "Cars source: $CARS_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA" || { echo 'Dealer main changed before publication' >&2; exit 1; }
          git push origin HEAD:main
