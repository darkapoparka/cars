      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Install one lock-pinned compiler and test runtime
        run: |
          npm ci --prefix templates/import --include=dev --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          const shared=path.resolve('templates/import/node_modules'),lock=JSON.parse(fs.readFileSync('templates/import/package-lock.json'));
          const require=createRequire(path.resolve('templates/import/package.json'));
          for(const [name,version]of Object.entries({svelte:'5.57.1',sharp:'0.35.5',typescript:'6.0.3',zod:'4.6.5',esbuild:'0.28.2'})){
            assert.equal(lock.packages['node_modules/'+name].version,version);
            assert.equal(JSON.parse(fs.readFileSync(path.join(shared,name,'package.json'))).version,version);
          }
          for(const directory of ['.','templates/auto-best','templates/karento-best','templates/mobile','templates/modern/packages/marketplace-domain']){
            const target=path.resolve(directory,'node_modules');assert(!fs.existsSync(target),'Do not replace another test runtime');
            fs.symlinkSync(shared,target,'dir');
          }
          console.log(JSON.stringify({runtime:'one-import-lock-install',svelte:require('svelte/package.json').version,sharp:require('sharp').versions.sharp}));
          NODE
      - name: Hydrate bounded historical text and icon test objects through the maintained source reader
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {spawn,execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          import {excluded} from './scripts/lib/workflow.mjs';
          import {prefetchPinnedSourceBlobs} from './scripts/dealer-updates/pinned-template-source.mjs';
          const root=process.cwd(),localEnv={...process.env,GIT_NO_LAZY_FETCH:'1',GIT_TERMINAL_PROMPT:'0'};
          const lock=JSON.parse(fs.readFileSync('templates.lock.json')),batch=JSON.parse(fs.readFileSync('leads/uk-2026-10-10-build-manifest.json'));
          const candidates=new Set([process.env.GITHUB_SHA,...Object.values(lock.templates).map(r=>r.commit),...Object.values(batch.sourceReleases).map(r=>r.revision)]);
          for(const name of fs.readdirSync('scripts').filter(n=>n.endsWith('.test.mjs')))for(const m of fs.readFileSync('scripts/'+name,'utf8').matchAll(/['"]([a-f0-9]{40})['"]/g))candidates.add(m[1]);
          const ids=[...candidates].filter(id=>/^[a-f0-9]{40}$/.test(id)).sort();assert(ids.length<=256);
          const check=execFileSync('git',['cat-file','--batch-check=%(objectname) %(objecttype)'],{input:ids.join('\n')+'\n',encoding:'utf8',env:localEnv}).trim().split('\n');assert.equal(check.length,ids.length);
          const commits=ids.filter((id,i)=>check[i]===id+' commit'),entries=new Map();
          for(const revision of commits){
            const child=spawn('git',['-C',root,'ls-tree','-rz',revision,'--','templates','clients','scripts'],{env:localEnv,stdio:['ignore','pipe','pipe']});
            const completion=new Promise(resolve=>{child.once('error',error=>resolve({error}));child.once('close',code=>resolve({code}));});
            let pending='',metadataBytes=0,stderr='';child.stdout.setEncoding('utf8');child.stderr.setEncoding('utf8');child.stderr.on('data',chunk=>{stderr=(stderr+chunk).slice(-16384);});
            try{for await(const chunk of child.stdout){metadataBytes+=Buffer.byteLength(chunk);assert(metadataBytes<=256*1024*1024,'Historical metadata exceeds its bounded read');pending+=chunk;
              let end;while((end=pending.indexOf('\0'))>=0){const record=pending.slice(0,end);pending=pending.slice(end+1);const m=/^([0-9]{6}) blob ([a-f0-9]{40})\t(.+)$/.exec(record);if(!m)continue;const name=m[3];if(excluded(name))continue;
                if(name.startsWith('scripts/')||(!/(?:^|\/)(?:static|public)(?:\/|$)/.test(name)&&/\.(?:[cm]?[jt]sx?|svelte|html|json|css)$/.test(name))||/\/(?:favicon\.ico|(?:apple-)?icon\.png)$/.test(name)||/^clients\/[^/]+\/dealer-brand\/logo-on-(?:light|dark)\.webp$/.test(name))entries.set(m[2],{blob:m[2]});
                assert(entries.size<=50000,'Historical source selection exceeds its exact-object bound');
              }assert(Buffer.byteLength(pending)<=32768,'Historical metadata contains an oversized path');
            }}catch(error){child.kill();await completion;throw error;}
            const done=await completion;assert(!done.error&&done.code===0,stderr||done.error?.message||'Historical metadata read failed');assert.equal(pending,'');
          }
          console.log(JSON.stringify({commits:commits.length,uniqueTestObjects:entries.size,...prefetchPinnedSourceBlobs({repositoryPath:root,entries:[...entries.values()],env:{...process.env,CARS_SOURCE_BATCH_PREFETCH:'1'}})}));
          NODE
      - name: Run the required executable workflow integration checkpoint once
        run: |
          mkdir -p runtime audits/2026-09-06
          node scripts/check-workflow.mjs
          node --test scripts/*.test.mjs
      - id: matrix
        run: node scripts/prepare-existing-fleet-source.mjs matrix >> "$GITHUB_OUTPUT"

  prepare_source:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DEALER_SLUG: ${{ matrix.slug }}
      NODE_OPTIONS: --max-old-space-size=4608
      NEXT_TELEMETRY_DISABLED: '1'
      # Hydrate exact pinned blob IDs in bounded multi-want batches, not one lazy fetch per file.
      CARS_SOURCE_BATCH_PREFETCH: '1'
    steps:
      - name: Check out published source, exact historical bases and bounded review inputs
        id: source_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Sparse blob:none history needs authenticated reads of approved template bases.
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /templates.lock.json
            /templates/auto-best/scripts/
            /docs/DEPLOYMENT-INVENTORY.json
            /docs/releases/cloudflare-existing25-20261011/source-request.json
            /docs/releases/cloudflare-existing25-20261011/selection.json
            ${{ matrix.mode != 'new-approved' && '/docs/releases/' || '' }}
            /clients/${{ matrix.slug }}/
            ${{ matrix.sourceInputs }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Establish actual synchronized main and all branch metadata for new source absence leases
        if: matrix.mode == 'new-approved'
        run: |
          git fetch --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'
          git switch -C main "$GITHUB_SHA"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$(git branch --show-current)" == main ]]
      - name: Install only the pinned source raster helper
        run: |
          mkdir -p runtime/source-preparation-tools
          printf '{"private":true}\n' > runtime/source-preparation-tools/package.json
          npm install --prefix runtime/source-preparation-tools --ignore-scripts --save-exact sharp@0.35.5
      - name: Plan preservation, apply reviewed branding, reseal and export the minimal source patch
        run: node scripts/prepare-existing-fleet-source.mjs prepare "$DEALER_SLUG"
      - name: End historical-source Git read authentication before artifact upload
        if: always() && steps.source_checkout.outcome == 'success'
        run: |
          credentials_config="$(git config --local --no-includes --get "includeIf.gitdir:$GITHUB_WORKSPACE/.git.path")"
          [[ "${credentials_config%/*}" == "$RUNNER_TEMP" && "${credentials_config##*/}" =~ ^git-credentials-[0-9a-f-]+\.config$ ]] || exit 1
          git config --file "$credentials_config" --unset-all http.https://github.com/.extraheader
          # Checkout post-cleanup removes its empty credential file and include entries.
      - name: Retain one reviewed-source proposal for root canonical publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: existing-cf-source-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/${{ matrix.mode == 'new-approved' && 'new-dealer-source' || 'existing-fleet-source' }}/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.slug }}/output/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
      - name: Preserve bounded conflict or intermediate-plan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: existing-cf-source-evidence-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/existing-fleet-source/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.slug }}/plan/review.json
            runtime/existing-fleet-source/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.slug }}/plan/run.json
            runtime/new-dealer-source/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.slug }}/failure.json
          if-no-files-found: warn
          retention-days: 7
