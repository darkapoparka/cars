      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Reuse the authenticated unchanged shared-code checkpoint
        id: shared_checkpoint
        env:
          CARS_CHECKPOINT_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const reviewedWorkflowSha256 = '1b8a498d0a019b96050c464e9a914b1f85d80ab67cbaa3649c7faa206a150342';
          const base='144169aa68bc22aac577ae5042245f0e2b8ff584',workflow='.github/workflows/existing-fleet-source.yml',runId=38620387848,jobId=116046077657;
          const fullStep='Run the required executable workflow integration checkpoint once';
          let reuse=false,reason='Unchanged shared-code checkpoint proof unavailable';
          try {
            assert.equal(process.env.GITHUB_REPOSITORY,'darkapoparka/cars');
            assert.equal(process.env.GITHUB_REF,'refs/heads/main');
            assert(/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA||''));
            const env={...process.env,GIT_NO_LAZY_FETCH:'1',GIT_OPTIONAL_LOCKS:'0',GIT_TERMINAL_PROMPT:'0'};
            const git=args=>execFileSync('git',args,{env,encoding:'utf8',maxBuffer:64*1024**2,timeout:30000}).trimEnd();
            git(['merge-base','--is-ancestor',base,process.env.GITHUB_SHA]);
            const object=(revision,name)=>git(['rev-parse',revision+':'+name]);
            for(const name of ['scripts','templates','templates.lock.json','templates/import/package-lock.json','docs/DEPLOYMENT-INVENTORY.json','clients/index.json','clients/README.md'])assert.equal(object(process.env.GITHUB_SHA,name),object(base,name),'Shared code/configuration changed: '+name);
            const listing=(revision,name='')=>git(['ls-tree','-z',name?revision+':'+name:revision]).split('\0').filter(Boolean);
            const protect=(name,except)=>assert.deepEqual(listing(process.env.GITHUB_SHA,name).filter(row=>!except.includes(row.split('\t')[1])),listing(base,name).filter(row=>!except.includes(row.split('\t')[1])),'Other root/workflow configuration changed: '+name);
            protect('',['clients','docs','leads','.github']);
            protect('.github',['workflows']);
            protect('.github/workflows',['existing-fleet-source.yml']);
            assert.equal(object(base,workflow),'15502c9cfff84ca2ab23ddc4e82dde9a2bbbd6cb');
            const workflowBytes=execFileSync('git',['show',process.env.GITHUB_SHA+':'+workflow],{env,encoding:'utf8',maxBuffer:64*1024**2,timeout:30000});
            assert.equal(fs.readFileSync(workflow,'utf8'),workflowBytes,'Workflow checkout differs from its pinned blob');
            const seals=[...workflowBytes.matchAll(/^          const reviewedWorkflowSha256 = '[a-f0-9]{64}';$/gm)];assert.equal(seals.length,1,'Reviewed workflow self seal is ambiguous');
            const normalized=workflowBytes.replace(/^          const reviewedWorkflowSha256 = '[a-f0-9]{64}';$/m,"          const reviewedWorkflowSha256 = 'REVIEWED_SELF_SHA256';");
            assert.equal(createHash('sha256').update(normalized).digest('hex'),reviewedWorkflowSha256,'Source workflow differs from the narrowly reviewed reuse change');
            const changed=git(['diff','--no-renames','--name-only','-z',base,process.env.GITHUB_SHA,'--']).split('\0').filter(Boolean);
            assert(changed.length<=500000,'Changed input inventory exceeds its bounded read');
            for(const name of changed){
              assert(!/[\\:\u0000-\u001f\u007f]/.test(name)&&name.split('/').every(part=>part&&part!=='.'&&part!=='..'),'Unsafe changed input path');
              assert(name===workflow||/^clients\/[a-z0-9]+(?:-[a-z0-9]+)*\/.+$/.test(name)||/^docs\/releases\/.+\.json$/.test(name)||/^docs\/logo-polish-2026-10-14\/.+\.(?:json|png|webp|ico)$/.test(name)||/^leads\/.+\.(?:json|md)$/.test(name),'Change lies outside dealer/source input data: '+name);
            }
            const get=async route=>{const response=await fetch('https://api.github.com/repos/darkapoparka/cars/'+route,{headers:{Authorization:'Bearer '+process.env.CARS_CHECKPOINT_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},signal:AbortSignal.timeout(20000)});assert(response.ok,'Authenticated checkpoint proof unavailable');return response.json();};
            const [run,jobs]=await Promise.all([get('actions/runs/'+runId+'/attempts/1'),get('actions/runs/'+runId+'/attempts/1/jobs?per_page=100')]);
            assert(run.id===runId&&run.run_attempt===1&&run.repository?.full_name==='darkapoparka/cars'&&run.head_repository?.full_name==='darkapoparka/cars'&&run.head_sha===base&&run.head_branch==='main'&&run.path===workflow&&run.workflow_id===381165184&&run.event==='push'&&run.status==='completed','Prior run identity changed');
            assert(jobs.total_count<=100&&Array.isArray(jobs.jobs),'Checkpoint job proof is incomplete');
            const plan=jobs.jobs.find(job=>job.id===jobId);
            assert(plan?.run_id===runId&&plan.run_attempt===1&&plan.name==='plan'&&plan.status==='completed'&&plan.conclusion==='success','Exact prior plan did not succeed');
            const full=plan.steps?.find(step=>step.number===7&&step.name===fullStep);
            assert(full?.status==='completed'&&full.conclusion==='success','Exact prior full checkpoint did not succeed');
            const age=Date.now()-Date.parse(plan.completed_at);assert(Number.isFinite(age)&&age>=0&&age<=24*60*60*1000,'Checkpoint proof is stale');
            reuse=true;reason='Authenticated unchanged shared-code checkpoint reused; changed dealer/source fixture data is not covered by that suite result';
          } catch(error) { reason='Full shared-code checkpoint required: '+error.message; }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'reuse='+reuse+'\n');
          const evidence={scope:'shared-code-only',reuse,priorRun:runId,priorAttempt:1,priorPlanJob:jobId,priorHead:base,currentHead:process.env.GITHUB_SHA,changedDealerFixtureDataTested:false,reason};
          console.log(JSON.stringify(evidence));
          if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Shared-code integration checkpoint\n\n'+reason+'\n\nFresh source matrix, dealer preservation, branding, native qualification and patch validation run for this request.\n');
          NODE
      - name: Install one lock-pinned compiler and test runtime
        if: steps.shared_checkpoint.outputs.reuse != 'true'
        run: |
          npm ci --prefix templates/import --include=dev --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          const shared=path.resolve('templates/import/node_modules'),lock=JSON.parse(fs.readFileSync('templates/import/package-lock.json'));
          const require=createRequire(path.resolve('templates/import/package.json'));
          for(const [name,version]of Object.entries({svelte:'5.57.1',sharp:'0.35.5',typescript:'6.0.3',zod:'4.6.5',esbuild:'0.28.2'})){
            assert.equal(lock.packages['node_modules/'+name].version,version);
            assert.equal(JSON.parse(fs.readFileSync(path.join(shared,name,'package.json'))).version,version);
          }
          for(const directory of ['.','templates/auto-best','templates/karento-best','templates/mobile','templates/modern/packages/marketplace-domain']){
            const target=path.resolve(directory,'node_modules');assert(!fs.existsSync(target),'Do not replace another test runtime');
            fs.symlinkSync(shared,target,'dir');
          }
          console.log(JSON.stringify({runtime:'one-import-lock-install',svelte:require('svelte/package.json').version,sharp:require('sharp').versions.sharp}));
          NODE
      - name: Install the pinned Worker stream-test runtime outside template dependencies
        if: steps.shared_checkpoint.outputs.reuse != 'true'
        run: |
          stream_test_root="$RUNNER_TEMP/cars-stream-test-runtime"
          [[ ! -e "$stream_test_root" ]]
          mkdir -p "$stream_test_root"
          printf '{"private":true}\n' > "$stream_test_root/package.json"
          npm install --prefix "$stream_test_root" --save-exact --no-audit --no-fund miniflare@5.20261006.1-alpha
          CARS_MINIFLARE_RESOLVE_FROM="$stream_test_root/package.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          const require=createRequire(process.env.CARS_MINIFLARE_RESOLVE_FROM);
          for(const [name,version]of Object.entries({miniflare:'5.20261006.1-alpha',workerd:'1.20261006.1'})){
            assert.equal(JSON.parse(fs.readFileSync(require.resolve(name+'/package.json'))).version,version);
          }
          assert.equal(typeof require('miniflare').Miniflare,'function');
          assert.equal(typeof require('miniflare').convertV4MiniflareOptions,'function');
          console.log(JSON.stringify({runtime:'separate-pinned-worker-stream-tests',miniflare:'5.20261006.1-alpha',workerd:'1.20261006.1'}));
          NODE
          printf 'CARS_MINIFLARE_RESOLVE_FROM=%s/package.json\n' "$stream_test_root" >> "$GITHUB_ENV"
      - name: Hydrate bounded historical text and icon test objects through the maintained source reader
        if: steps.shared_checkpoint.outputs.reuse != 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {spawn,execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          import {excluded} from './scripts/lib/workflow.mjs';
          import {prefetchPinnedSourceBlobs} from './scripts/dealer-updates/pinned-template-source.mjs';
          const root=process.cwd(),localEnv={...process.env,GIT_NO_LAZY_FETCH:'1',GIT_TERMINAL_PROMPT:'0'};
          const lock=JSON.parse(fs.readFileSync('templates.lock.json')),batch=JSON.parse(fs.readFileSync('leads/uk-2026-10-10-build-manifest.json'));
          const candidates=new Set([process.env.GITHUB_SHA,...Object.values(lock.templates).map(r=>r.commit),...Object.values(batch.sourceReleases).map(r=>r.revision)]);
          for(const name of fs.readdirSync('scripts').filter(n=>n.endsWith('.test.mjs')))for(const m of fs.readFileSync('scripts/'+name,'utf8').matchAll(/['"]([a-f0-9]{40})['"]/g))candidates.add(m[1]);
          const ids=[...candidates].filter(id=>/^[a-f0-9]{40}$/.test(id)).sort();assert(ids.length<=256);
          const check=execFileSync('git',['cat-file','--batch-check=%(objectname) %(objecttype)'],{input:ids.join('\n')+'\n',encoding:'utf8',env:localEnv}).trim().split('\n');assert.equal(check.length,ids.length);
          const commits=ids.filter((id,i)=>check[i]===id+' commit'),entries=new Map();
          for(const revision of commits){
            const child=spawn('git',['-C',root,'ls-tree','-rz',revision,'--','templates','clients','scripts'],{env:localEnv,stdio:['ignore','pipe','pipe']});
            const completion=new Promise(resolve=>{child.once('error',error=>resolve({error}));child.once('close',code=>resolve({code}));});
            let pending='',metadataBytes=0,stderr='';child.stdout.setEncoding('utf8');child.stderr.setEncoding('utf8');child.stderr.on('data',chunk=>{stderr=(stderr+chunk).slice(-16384);});
            try{for await(const chunk of child.stdout){metadataBytes+=Buffer.byteLength(chunk);assert(metadataBytes<=256*1024*1024,'Historical metadata exceeds its bounded read');pending+=chunk;
              let end;while((end=pending.indexOf('\0'))>=0){const record=pending.slice(0,end);pending=pending.slice(end+1);const m=/^([0-9]{6}) blob ([a-f0-9]{40})\t(.+)$/.exec(record);if(!m)continue;const name=m[3],pinnedNativeCode=revision==='827d75b9a53666c6feb09f04e3f8e7f255e95a30'&&/^templates\/modern\/.*\.(?:ts|tsx|js|jsx|mjs|svelte)$/.test(name);if(excluded(name)&&!pinnedNativeCode)continue;
                if(pinnedNativeCode||name.startsWith('scripts/')||(!/(?:^|\/)(?:static|public)(?:\/|$)/.test(name)&&/\.(?:[cm]?[jt]sx?|svelte|html|json|css)$/.test(name))||/\/(?:favicon\.ico|(?:apple-)?icon\.png)$/.test(name)||/^clients\/[^/]+\/dealer-brand\/logo-on-(?:light|dark)\.webp$/.test(name))entries.set(m[2],{blob:m[2]});
                assert(entries.size<=50000,'Historical source selection exceeds its exact-object bound');
              }assert(Buffer.byteLength(pending)<=32768,'Historical metadata contains an oversized path');
            }}catch(error){child.kill();await completion;throw error;}
            const done=await completion;assert(!done.error&&done.code===0,stderr||done.error?.message||'Historical metadata read failed');assert.equal(pending,'');
          }
          console.log(JSON.stringify({commits:commits.length,uniqueTestObjects:entries.size,...prefetchPinnedSourceBlobs({repositoryPath:root,entries:[...entries.values()],env:{...process.env,CARS_SOURCE_BATCH_PREFETCH:'1'}})}));
          NODE
      - name: Run the required executable workflow integration checkpoint once
        if: steps.shared_checkpoint.outputs.reuse != 'true'
        run: |
          mkdir -p runtime audits/2026-09-06
          node scripts/check-workflow.mjs
          node --test scripts/*.test.mjs
      - id: matrix
        run: node scripts/prepare-existing-fleet-source.mjs matrix >> "$GITHUB_OUTPUT"

  prepare_source:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DEALER_SLUG: ${{ matrix.slug }}
      NODE_OPTIONS: --max-old-space-size=4608
      NEXT_TELEMETRY_DISABLED: '1'
      # Hydrate exact pinned blob IDs in bounded multi-want batches, not one lazy fetch per file.
      CARS_SOURCE_BATCH_PREFETCH: '1'
    steps:
      - name: Check out published source, exact historical bases and bounded review inputs
        id: source_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Sparse blob:none history needs authenticated reads of approved template bases.
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /templates.lock.json
            /templates/auto-best/scripts/
            /docs/DEPLOYMENT-INVENTORY.json
            /docs/releases/cloudflare-existing25-20261011/source-request.json
            /docs/releases/cloudflare-existing25-20261011/selection.json
            ${{ matrix.mode != 'new-approved' && '/docs/releases/' || '' }}
            /clients/${{ matrix.slug }}/
            ${{ matrix.sourceInputs }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Establish actual synchronized main and all branch metadata for new source absence leases
        if: matrix.mode == 'new-approved'
        run: |
          git fetch --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'
          git switch -C main "$GITHUB_SHA"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" && "$(git branch --show-current)" == main ]]
      - name: Install only the pinned source raster helper
        run: |
          mkdir -p runtime/source-preparation-tools
          printf '{"private":true}\n' > runtime/source-preparation-tools/package.json
          npm install --prefix runtime/source-preparation-tools --ignore-scripts --save-exact sharp@0.35.5
      - name: Plan preservation, apply reviewed branding, reseal and export the minimal source patch
        run: node scripts/prepare-existing-fleet-source.mjs prepare "$DEALER_SLUG"
      - name: End historical-source Git read authentication before artifact upload
        if: always() && steps.source_checkout.outcome == 'success'
        run: |
          credentials_config="$(git config --local --no-includes --get "includeIf.gitdir:$GITHUB_WORKSPACE/.git.path")"
          [[ "${credentials_config%/*}" == "$RUNNER_TEMP" && "${credentials_config##*/}" =~ ^git-credentials-[0-9a-f-]+\.config$ ]] || exit 1
          git config --file "$credentials_config" --unset-all http.https://github.com/.extraheader
          # Checkout post-cleanup removes its empty credential file and include entries.
      - name: Retain one reviewed-source proposal for root canonical publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: existing-cf-source-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/${{ matrix.mode == 'new-approved' && 'new-dealer-source' || 'existing-fleet-source' }}/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.slug }}/output/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
      - name: Preserve bounded conflict or intermediate-plan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: existing-cf-source-evidence-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/existing-fleet-source/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.slug }}/plan/review.json
            runtime/existing-fleet-source/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.slug }}/plan/run.json
            runtime/new-dealer-source/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.slug }}/failure.json
          if-no-files-found: warn
          retention-days: 7

