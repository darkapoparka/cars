name: Test Navara localization rollout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-navara-localization-rollout.yml'
      - 'scripts/rollout-localized-client.mjs'

permissions:
  contents: read

concurrency:
  group: test-navara-localization-rollout
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: cars
          fetch-depth: 0

      - name: Checkout exact Navara source
        uses: actions/checkout@v4
        with:
          repository: darkapoparka/cars-navaracar
          ref: 6eae1503e1f4c8e0fa768e5d71d440cdc84adfe1
          path: client

      - uses: actions/setup-node@v4
        with:
          node-version: '24.8.0'

      - name: Build localized package
        shell: bash
        run: |
          set -euo pipefail
          node cars/scripts/rollout-localized-client.mjs \
            --client-root "$GITHUB_WORKSPACE/client" \
            --slug navara-car \
            --repository darkapoparka/cars-navaracar \
            --output "$RUNNER_TEMP/navara-localized"
          node cars/scripts/export-dealer.mjs --source "$RUNNER_TEMP/navara-localized" --verify
          test -f "$RUNNER_TEMP/navara-localized/localization/contract.json"
          test -f "$RUNNER_TEMP/navara-localized/localization/adoption.json"

      - name: Validate generated apps
        shell: bash
        run: |
          set -euo pipefail
          for app in auto-best carwow; do
            pushd "$RUNNER_TEMP/navara-localized/$app"
            npm ci
            npm run check --if-present
            npm run build --if-present
            popd
          done
          pushd "$RUNNER_TEMP/navara-localized/modern"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @repo/database build --if-present
          pnpm --filter web build
          popd
