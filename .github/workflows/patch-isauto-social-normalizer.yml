name: Patch IS AUTO Auto Best finalizer

on:
  # Dealer publishing and historical repair runs require explicit dispatch.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts/finalize-isauto-autobest-assets.mjs
      - name: Preserve approved Auto Best video surface
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          target = Path('scripts/finalize-isauto-autobest-assets.mjs')
          text = target.read_text(encoding='utf-8').replace('\r\n', '\n')
          old = '''const videoSectionPath = path.join(
            autoBest,
            'src',
            'lib',
            'components',
            'home',
            'VideoSection.svelte'
          );
          const videoSection = await fs.readFile(videoSectionPath, 'utf8');
          if (/featuredVideos|<iframe|dn-videos/.test(videoSection)) {
            throw new Error('The inherited Auto Best video surface is still rendered for IS AUTO.');
          }

          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one obsolete VideoSection assertion, found {text.count(old)}')
          text = text.replace(old, '')
          text = text.replace(
              "console.log('Retired Auto Best video assets and UI removed; Modern related listings and seller status fixtures repaired.');",
              "console.log('Retired Auto Best video data/assets removed while approved component composition is preserved; Modern related listings and seller status fixtures repaired.');"
          )
          target.write_text(text, encoding='utf-8')
          PY
          node --check scripts/finalize-isauto-autobest-assets.mjs
      - name: Commit finalizer fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/finalize-isauto-autobest-assets.mjs
          git commit -m 'Preserve approved Auto Best video surface'
          git push origin HEAD:main
