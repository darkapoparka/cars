name: Patch IS AUTO content normalizer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-isauto-social-normalizer.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts/normalize-isauto-varna.mjs
      - name: Keep the approved Auto Best video component intact
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          target = Path('scripts/normalize-isauto-varna.mjs')
          lines = target.read_text(encoding='utf-8').replace('\r\n', '\n').splitlines()
          prefixes = (
              'const emptyAutoBestVideoComponent = ',
              "await writeTo(AUTO_BEST, 'src/lib/components/home/VideoSection.svelte'"
          )
          kept = [line for line in lines if not line.startswith(prefixes)]
          if len(lines) - len(kept) != 2:
              raise SystemExit(f'expected to remove two VideoSection rewrite lines, removed {len(lines) - len(kept)}')
          marker = "await writeTo(AUTO_BEST, 'src/lib/components/home/VideoSection.svelte'"
          if any(marker in line for line in kept):
              raise SystemExit('VideoSection rewrite remains')
          target.write_text('\n'.join(kept) + '\n', encoding='utf-8')
          PY
          node --check scripts/normalize-isauto-varna.mjs
      - name: Commit content normalizer fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/normalize-isauto-varna.mjs
          git commit -m 'Keep approved Auto Best video composition'
          git push origin HEAD:main
