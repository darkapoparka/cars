name: Reusable approved dealer logo refresh

on:
  workflow_call:
    inputs:
      dealer:
        required: true
        type: string
      strategy:
        required: true
        type: string
      rationale:
        required: true
        type: string
      source:
        required: true
        type: string
      accent:
        required: false
        default: '#f7d84a'
        type: string

permissions:
  contents: write

jobs:
  implement-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated image tooling
        run: npm install --prefix "$RUNNER_TEMP/cars-logo-tools" sharp@0.35.1 --no-audit --no-fund
      - name: Render transparent contextual pack and wire every variant
        env:
          DEALER_SLUG: ${{ inputs.dealer }}
          IDENTITY_STRATEGY: ${{ inputs.strategy }}
          IDENTITY_RATIONALE: ${{ inputs.rationale }}
          LOGO_SOURCE: ${{ inputs.source }}
          ACCENT_COLOR: ${{ inputs.accent }}
          CARS_LOGO_SHARP_ROOT: ${{ runner.temp }}/cars-logo-tools
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/approved-logo-refresh.mjs" <<'CARS_LOGO_SCRIPT'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { createRequire } from 'node:module';
          const sharpRoot = process.env.CARS_LOGO_SHARP_ROOT;
          if (!sharpRoot) throw new Error('CARS_LOGO_SHARP_ROOT is required.');
          const sharp = createRequire(path.join(sharpRoot, 'package.json'))('sharp');

          const root = process.cwd();
          const dealer = process.env.DEALER_SLUG || path.basename(root);
          const strategy = process.env.IDENTITY_STRATEGY;
          const rationale = process.env.IDENTITY_RATIONALE || '';
          const requestedSource = process.env.LOGO_SOURCE || '';
          const accent = process.env.ACCENT_COLOR || '#f7d84a';
          const allowedStrategies = new Set(['REFINE OFFICIAL LOGO', 'USE GENERATED CANDIDATE']);
          if (!allowedStrategies.has(strategy)) throw new Error(`Invalid IDENTITY_STRATEGY: ${strategy}`);

          const exists = async (p) => fs.access(p).then(() => true, () => false);
          const sha256 = (b) => crypto.createHash('sha256').update(b).digest('hex');
          const normalize = (p) => p.replaceAll('\\', '/');

          async function walk(dir, output = []) {
            if (!(await exists(dir))) return output;
            for (const entry of await fs.readdir(dir, { withFileTypes: true })) {
              if (['node_modules', '.git', '.next', '.svelte-kit', 'build', 'dist', '.turbo'].includes(entry.name)) continue;
              const target = path.join(dir, entry.name);
              if (entry.isDirectory()) await walk(target, output);
              else if (entry.isFile()) output.push(target);
            }
            return output;
          }

          async function resolveSource() {
            const explicit = requestedSource ? path.resolve(root, requestedSource) : null;
            if (explicit && await exists(explicit)) return explicit;
            const preferred = [
              'assets/brand/logo-master.png',
              'auto-best/static/assets/brand/logo-master.png',
              'auto-best/static/assets/brand/logo-on-light.webp',
              'carwow/static/assets/brand/logo-master.png',
              'carwow/static/assets/brand/logo-on-light.webp',
              'modern/apps/web/public/assets/brand/logo-master.png',
              'modern/apps/web/public/assets/brand/logo-on-light.webp',
              'import/static/assets/brand/logo-master.png',
              'import/static/assets/brand/logo-on-light.webp'
            ];
            for (const relative of preferred) {
              const target = path.join(root, relative);
              if (await exists(target)) return target;
            }
            throw new Error(`Approved logo source not found. Requested: ${requestedSource}`);
          }

          function sampleBorderBackground(data, width, height) {
            const samples = [];
            const add = (x, y) => {
              const i = (y * width + x) * 4;
              if (data[i + 3] > 245) samples.push([data[i], data[i + 1], data[i + 2]]);
            };
            const sx = Math.max(1, Math.floor(width / 150));
            const sy = Math.max(1, Math.floor(height / 150));
            for (let x = 0; x < width; x += sx) { add(x, 0); add(x, height - 1); }
            for (let y = 0; y < height; y += sy) { add(0, y); add(width - 1, y); }
            if (samples.length < 20) return null;
            const mean = [0, 1, 2].map(c => samples.reduce((s, p) => s + p[c], 0) / samples.length);
            const distances = samples.map(p => Math.hypot(p[0] - mean[0], p[1] - mean[1], p[2] - mean[2]));
            const close = distances.filter(d => d < 24).length / distances.length;
            const rms = Math.sqrt(distances.reduce((s, d) => s + d * d, 0) / distances.length);
            return close >= 0.90 && rms <= 24 ? { r: mean[0], g: mean[1], b: mean[2] } : null;
          }

          async function makeMaster(source) {
            const original = await fs.readFile(source);
            const { data, info } = await sharp(original, { density: 600, failOn: 'error' })
              .rotate()
              .ensureAlpha()
              .raw()
              .toBuffer({ resolveWithObject: true });
            if (!info.width || !info.height) throw new Error('Logo source has no dimensions.');
            const pixels = info.width * info.height;
            let transparent = 0;
            for (let i = 3; i < data.length; i += 4) if (data[i] < 15) transparent++;
            const output = Buffer.from(data);
            let removedBackground = null;
            if (transparent / pixels < 0.01) {
              const bg = sampleBorderBackground(output, info.width, info.height);
              if (!bg) throw new Error(`Opaque/boxed source rejected: ${normalize(path.relative(root, source))}`);
              removedBackground = { r: Math.round(bg.r), g: Math.round(bg.g), b: Math.round(bg.b) };
              for (let i = 0; i < output.length; i += 4) {
                const d = Math.hypot(output[i] - bg.r, output[i + 1] - bg.g, output[i + 2] - bg.b);
                const alpha = Math.max(0, Math.min(1, (d - 14) / 50));
                output[i + 3] = Math.round(output[i + 3] * alpha);
              }
            }
            const trimmed = await sharp(output, { raw: info })
              .trim({ background: { r: 0, g: 0, b: 0, alpha: 0 }, threshold: 4 })
              .png()
              .toBuffer();
            const tm = await sharp(trimmed).metadata();
            if (!tm.width || !tm.height || tm.width < 40 || tm.height < 20) throw new Error('Logo source became empty after cleanup.');
            const inner = await sharp(trimmed)
              .resize({ width: 1280, height: 320, fit: 'inside', withoutEnlargement: false, kernel: 'lanczos3' })
              .png()
              .toBuffer();
            const im = await sharp(inner).metadata();
            const master = await sharp({ create: { width: 1400, height: 420, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } })
              .composite([{ input: inner, left: Math.floor((1400 - im.width) / 2), top: Math.floor((420 - im.height) / 2) }])
              .png({ compressionLevel: 9, adaptiveFiltering: true })
              .toBuffer();
            return { master, sourceBytes: original, sourceDimensions: { width: info.width, height: info.height }, removedBackground };
          }

          async function monochrome(master, rgb) {
            const { data, info } = await sharp(master).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
            const output = Buffer.from(data);
            for (let i = 0; i < output.length; i += 4) {
              if (output[i + 3] === 0) continue;
              output[i] = rgb[0]; output[i + 1] = rgb[1]; output[i + 2] = rgb[2];
            }
            return sharp(output, { raw: info }).png({ compressionLevel: 9, adaptiveFiltering: true }).toBuffer();
          }

          async function validateTransparent(buffer, label) {
            const { data, info } = await sharp(buffer).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
            let transparent = 0, visible = 0;
            for (let i = 3; i < data.length; i += 4) {
              if (data[i] < 10) transparent++;
              if (data[i] > 30) visible++;
            }
            const pixels = info.width * info.height;
            if (transparent / pixels < 0.20) throw new Error(`${label}: transparent area too small.`);
            if (visible / pixels > 0.70) throw new Error(`${label}: plate-like visible area rejected.`);
            const edge = [];
            const add = (x, y) => edge.push(data[(y * info.width + x) * 4 + 3]);
            for (let x = 0; x < info.width; x += 10) { add(x, 0); add(x, info.height - 1); }
            for (let y = 0; y < info.height; y += 10) { add(0, y); add(info.width - 1, y); }
            if (edge.some(a => a > 10)) throw new Error(`${label}: mark touches canvas edge.`);
            return { width: info.width, height: info.height, transparentRatio: transparent / pixels, visibleRatio: visible / pixels };
          }

          const source = await resolveSource();
          const { master, sourceBytes, sourceDimensions, removedBackground } = await makeMaster(source);
          const onLight = await monochrome(master, [22, 24, 29]);
          const onDark = await monochrome(master, [255, 255, 255]);
          const onAccent = await monochrome(master, [22, 24, 29]);
          const validation = {
            master: await validateTransparent(master, 'logo-master'),
            onLight: await validateTransparent(onLight, 'logo-on-light'),
            onDark: await validateTransparent(onDark, 'logo-on-dark'),
            onAccent: await validateTransparent(onAccent, 'logo-on-accent')
          };

          const variantRoots = [
            ['root', 'assets/brand'],
            ['auto-best', 'auto-best/static/assets/brand'],
            ['modern', 'modern/apps/web/public/assets/brand'],
            ['carwow', 'carwow/static/assets/brand'],
            ['import', 'import/static/assets/brand']
          ];
          const packs = [];
          async function writePack(relative) {
            const dir = path.join(root, relative);
            await fs.mkdir(dir, { recursive: true });
            const files = {
              'logo-master.png': master,
              'logo-on-light.png': onLight,
              'logo-on-dark.png': onDark,
              'logo-on-accent.png': onAccent
            };
            for (const [name, buffer] of Object.entries(files)) await fs.writeFile(path.join(dir, name), buffer);
            for (const [name, buffer] of Object.entries({
              'logo-master.webp': master,
              'logo-on-light.webp': onLight,
              'logo-on-dark.webp': onDark,
              'logo-on-accent.webp': onAccent
            })) {
              await fs.writeFile(path.join(dir, name), await sharp(buffer).webp({ quality: 95, alphaQuality: 100, effort: 6 }).toBuffer());
            }
            for (const obsolete of ['logo-universal.png', 'logo-universal.webp', 'logo-on-yellow.png', 'logo-on-yellow.webp']) {
              await fs.rm(path.join(dir, obsolete), { force: true });
            }
            packs.push(relative);
          }
          for (const [name, relative] of variantRoots) {
            if (name === 'root' || await exists(path.join(root, name))) await writePack(relative);
          }

          const textExt = new Set(['.ts', '.js', '.mjs', '.cjs', '.svelte', '.tsx', '.jsx', '.json', '.md']);
          async function rewriteTree(base, variant) {
            if (!(await exists(base))) return [];
            const changed = [];
            for (const file of await walk(base)) {
              if (!textExt.has(path.extname(file).toLowerCase())) continue;
              let text;
              try { text = await fs.readFile(file, 'utf8'); } catch { continue; }
              const before = text;
              if (variant === 'auto-best') {
                text = text.replace(/(logoOnDark\s*:\s*)["'][^"']+["']/g, `$1'/assets/brand/logo-on-dark.webp'`);
                text = text.replace(/(\blogo\s*:\s*)["'][^"']+["']/g, `$1'/assets/brand/logo-on-light.webp'`);
              } else if (variant === 'modern') {
                text = text.replace(/(logoPath\s*:\s*)["'][^"']+["']/g, `$1"/assets/brand/logo-on-dark.webp"`);
              } else if (variant === 'carwow') {
                text = text.replace(/(logoLight\s*:\s*)["'][^"']+["']/g, `$1"/variant-3/assets/brand/logo-on-dark.webp"`);
                text = text.replace(/(logoDark\s*:\s*)["'][^"']+["']/g, `$1"/variant-3/assets/brand/logo-on-accent.webp"`);
                text = text.replaceAll('/variant-3/assets/brand/logo-universal.webp', '/variant-3/assets/brand/logo-on-dark.webp');
                text = text.replaceAll('/variant-3/assets/brand/logo-on-yellow.webp', '/variant-3/assets/brand/logo-on-accent.webp');
              } else if (variant === 'import') {
                text = text.replace(/(logoLight\s*:\s*)["'][^"']+["']/g, `$1'/variant-2/assets/brand/logo-on-dark.webp'`);
                text = text.replace(/(logoDark\s*:\s*)["'][^"']+["']/g, `$1'/variant-2/assets/brand/logo-on-accent.webp'`);
              }
              text = text.replaceAll('/assets/brand/logo-universal.webp', '/assets/brand/logo-on-dark.webp');
              text = text.replaceAll('/assets/brand/logo-on-yellow.webp', '/assets/brand/logo-on-accent.webp');
              if (text !== before) {
                await fs.writeFile(file, text.replace(/\r\n/g, '\n'));
                changed.push(normalize(path.relative(root, file)));
              }
            }
            return changed;
          }
          const rewired = [
            ...await rewriteTree(path.join(root, 'auto-best/src'), 'auto-best'),
            ...await rewriteTree(path.join(root, 'modern/packages'), 'modern'),
            ...await rewriteTree(path.join(root, 'modern/apps/web'), 'modern'),
            ...await rewriteTree(path.join(root, 'carwow/src'), 'carwow'),
            ...await rewriteTree(path.join(root, 'import/src'), 'import')
          ];

          const implementation = {
            schemaVersion: 2,
            dealer,
            strategy,
            rationale,
            approvedSource: normalize(path.relative(root, source)),
            approvedSourceSha256: sha256(sourceBytes),
            sourceDimensions,
            removedBackground,
            assets: {
              master: 'assets/brand/logo-master.png',
              onLight: 'assets/brand/logo-on-light.webp',
              onDark: 'assets/brand/logo-on-dark.webp',
              onAccent: 'assets/brand/logo-on-accent.webp',
              universal: null
            },
            surfaces: { light: '#ffffff', dark: '#16181d', accent },
            validation,
            replicatedPacks: packs,
            rewiredFiles: [...new Set(rewired)].sort(),
            generatedAt: new Date().toISOString()
          };
          await fs.writeFile(path.join(root, 'logo-implementation.json'), `${JSON.stringify(implementation, null, 2)}\n`);
          console.log(JSON.stringify(implementation, null, 2));
          CARS_LOGO_SCRIPT
          node "$RUNNER_TEMP/approved-logo-refresh.mjs"
      - name: Build Auto Best
        if: ${{ hashFiles('auto-best/package-lock.json') != '' }}
        working-directory: auto-best
        run: |
          npm ci --no-audit --no-fund
          npm run check --if-present
          npm run check:assets --if-present
          npm run build
      - name: Build Modern
        if: ${{ hashFiles('modern/pnpm-lock.yaml') != '' }}
        working-directory: modern
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @repo/database build
          pnpm --filter web build
      - name: Build Import variant
        if: ${{ hashFiles('import/package-lock.json') != '' }}
        working-directory: import
        run: |
          npm ci --no-audit --no-fund
          npm run check --if-present
          npm run build
      - name: Build Carwow
        if: ${{ hashFiles('carwow/package-lock.json') != '' }}
        working-directory: carwow
        run: |
          npm ci --no-audit --no-fund
          npm run check --if-present
          npm run build
      - name: Commit exact tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for target in \
            assets/brand \
            logo-implementation.json \
            auto-best/static/assets/brand \
            auto-best/src \
            modern/apps/web/public/assets/brand \
            modern/apps/web \
            modern/packages \
            carwow/static/assets/brand \
            carwow/src \
            import/static/assets/brand \
            import/src; do
            if [ -e "$target" ]; then git add -A -- "$target"; fi
          done
          if git diff --cached --quiet; then
            echo "No logo implementation changes produced." >&2
            exit 1
          fi
          git commit -m "Implement approved transparent contextual logo pack [skip ci]"
          git push origin HEAD:main
          echo "Production source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
