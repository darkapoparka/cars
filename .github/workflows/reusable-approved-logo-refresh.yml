name: Reusable approved dealer logo refresh

on:
  workflow_call:
    inputs:
      dealer:
        required: true
        type: string
      strategy:
        required: true
        type: string
      rationale:
        required: true
        type: string
      source:
        required: true
        type: string
      accent:
        required: false
        default: '#f7d84a'
        type: string

permissions:
  contents: write

jobs:
  implement-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm reusable workflow
        run: |
          echo "dealer=${{ inputs.dealer }}"
          echo "strategy=${{ inputs.strategy }}"
          test -n "${{ inputs.source }}"
