name: Logo production QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/logo-production-qa.yml'
      - 'scripts/logo-production-qa.mjs'

permissions:
  contents: read

jobs:
  capture:
    name: Capture shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Capture production variants
        run: node scripts/logo-production-qa.mjs "${{ matrix.shard }}" 4
      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: logo-production-qa-shard-${{ matrix.shard }}
          path: artifacts/logo-production-qa/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14
