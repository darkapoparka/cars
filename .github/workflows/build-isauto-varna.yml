name: Build IS AUTO Varna lead

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-isauto-varna.yml
      - scripts/build-isauto-varna.mjs
      - scripts/build-isauto-varna.part-*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-isauto-varna-lead
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out canonical build surface
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /.gitignore
            /catalog.json
            /templates.lock.json
            /docs/
            /scripts/
            /leads/bulgaria.json
            /.github/workflows/
            /templates/auto-best/
            /templates/modern/
            /templates/carwow/
            /clients/isauto-varna/

      - name: Prepare assembly
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "scripts/build-isauto-varna.part-*" > /dev/null; then
            cat scripts/build-isauto-varna.part-* > scripts/build-isauto-varna.mjs
          fi
          node --check scripts/build-isauto-varna.mjs

      - name: Set up Node 24 for personalization
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create canonical client from approved locks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clients
          if [ ! -d clients/isauto-varna ]; then
            node scripts/new-client.mjs \
              --client isauto-varna \
              --repository darkapoparka/cars-isautovarna \
              --preset standard \
              --dry-run
            node scripts/new-client.mjs \
              --client isauto-varna \
              --repository darkapoparka/cars-isautovarna \
              --preset standard
          fi

      - name: Install isolated image tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/isauto-image-tools" sharp@0.35.1 --no-audit --no-fund

      - name: Personalize dealer identity, inventory and media
        shell: bash
        env:
          IS_AUTO_SHARP_ROOT: ${{ runner.temp }}/isauto-image-tools
        run: |
          set -euo pipefail
          node scripts/build-isauto-varna.mjs

      - name: Set up Node 22 for Auto Best
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: clients/isauto-varna/auto-best/package-lock.json

      - name: Validate Auto Best
        working-directory: clients/isauto-varna/auto-best
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check
          npm run check:assets
          npm run build

      - name: Set up Node 22 for Modern
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'

      - name: Validate Modern
        working-directory: clients/isauto-varna/modern
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @repo/database build
          pnpm --filter web build

      - name: Set up Node 24 for Carwow
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/isauto-varna/carwow/package-lock.json

      - name: Validate Carwow
        working-directory: clients/isauto-varna/carwow
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check
          npm run build

      - name: Commit canonical lead to main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if compgen -G "scripts/build-isauto-varna.part-*" > /dev/null; then
            git rm -f scripts/build-isauto-varna.part-*
          fi
          # Build tools create ignored dependency/cache trees containing pnpm links.
          # Remove only ignored output before asking Git to stage the new canonical source.
          git clean -fdX -- clients/isauto-varna
          remaining_links="$(find clients/isauto-varna -type l -print)"
          if [ -n "$remaining_links" ]; then
            printf 'Unexpected retained links after cleanup:\n%s\n' "$remaining_links" >&2
            exit 1
          fi
          git add --sparse -A scripts/build-isauto-varna.mjs
          git add --sparse -A clients/isauto-varna
          git add --sparse -A leads/bulgaria.json
          git add --sparse -A .github/workflows/publish-isauto-package.yml
          if ! git diff --cached --quiet; then
            git commit -m "Build IS AUTO Varna three-variant lead"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Canonical source commit: $source_sha"

      - name: Build deterministic deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime/dealer-packages/isauto-varna
          node scripts/package-dealer.mjs \
            --client isauto-varna \
            --out runtime/dealer-packages/isauto-varna \
            --source-commit "${{ steps.source.outputs.source_sha }}" \
            --write

      - name: Publish deployment package branch
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_BRANCH: publish/isauto-varna
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE/runtime/dealer-packages/isauto-varna"
          publish_dir="$RUNNER_TEMP/isauto-varna-publish"
          mkdir -p "$publish_dir"
          cd "$publish_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin "refs/heads/${PACKAGE_BRANCH}"; then
            git checkout -B "$PACKAGE_BRANCH" FETCH_HEAD
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            git checkout --orphan "$PACKAGE_BRANCH"
          fi
          cp -a "$package"/. .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish isauto-varna from canonical ${{ steps.source.outputs.source_sha }}"
            git push origin "HEAD:refs/heads/${PACKAGE_BRANCH}"
          fi
          package_sha="$(git rev-parse HEAD)"
          echo "package_sha=$package_sha" >> "$GITHUB_OUTPUT"
          echo "Package commit: $package_sha"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## IS AUTO Varna"
            echo "- Canonical source: ${{ steps.source.outputs.source_sha }}"
            echo "- Package branch: publish/isauto-varna"
            echo "- Package commit: ${{ steps.package.outputs.package_sha }}"
            echo "- Auto Best, Modern and Carwow builds passed before publication."
          } >> "$GITHUB_STEP_SUMMARY"
