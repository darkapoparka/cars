name: Modern native capture diagnostic
on:
  push:
    branches: [main]
    paths: [docs/releases/cloudflare-existing25-20261011/modern-diagnostic-request.json]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: cars-modern-native-diagnostic
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'darkapoparka/cars' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      dealers: ${{ steps.matrix.outputs.dealers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/workflows/modern-native-diagnostic.yml
            /docs/DEPLOYMENT-INVENTORY.json
            /docs/releases/cloudflare-existing25-20261011/selection.json
            /docs/releases/cloudflare-existing25-20261011/build-request.json
            /docs/releases/cloudflare-existing25-20261011/modern-diagnostic-request.json
            /templates/karento-best/src/lib/components/Header.svelte
            /templates/karento-best/src/lib/components/MobileNavigation.svelte
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - id: matrix
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('docs/releases/cloudflare-existing25-20261011/modern-diagnostic-request.json'));
          if(r.schemaVersion!==1||r.kind!=='cars-modern-native-diagnostic'||r.dealer!=='priselci'||r.family!=='modern'||r.admittedForDelivery!==false||r.providerWrites!==false)throw Error('Unexpected bounded diagnostic request');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'matrix='+JSON.stringify({include:[{slug:r.dealer,key:r.family,node:'22.23.2'}]})+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'dealers='+JSON.stringify({include:[]})+'\n');
          NODE
  compile:
    needs: plan
    name: ${{ matrix.slug }} / ${{ matrix.key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DEALER_SLUG: ${{ matrix.slug }}
      DEALER_FAMILY: ${{ matrix.key }}
      NODE_OPTIONS: --max-old-space-size=4608
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out exact build source and historical publication proof objects
        id: compile_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /docs/DEPLOYMENT-INVENTORY.json
            /docs/releases/cloudflare-existing25-20261011/selection.json
            /docs/releases/cloudflare-existing25-20261011/build-request.json
            /docs/releases/cloudflare-existing25-20261011/modern-diagnostic-request.json
            /docs/releases/**/*.json
            /docs/releases/cloudflare-existing25-20261011/new-source/${{ matrix.slug }}/
            /templates.lock.json
            /clients/index.json
            /clients/${{ matrix.slug }}/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install pinned share tooling without Cloudflare credentials
        run: |
          mkdir -p runtime/varna-tools
          printf '{"private":true}\n' > runtime/varna-tools/package.json
          npm install --prefix runtime/varna-tools --ignore-scripts --save-exact sharp@0.35.5 typescript@6.0.3
      - name: Compile current dealer with maintained native Cloudflare adapters
        run: node scripts/build-existing-fleet-cloudflare.mjs compile "$DEALER_SLUG" "$DEALER_FAMILY"
      - name: End historical-build Git read authentication before artifact upload
        if: always() && steps.compile_checkout.outcome == 'success'
        run: |
          credentials_config="$(git config --local --no-includes --get "includeIf.gitdir:$GITHUB_WORKSPACE/.git.path")"
          [[ "${credentials_config%/*}" == "$RUNNER_TEMP" && "${credentials_config##*/}" =~ ^git-credentials-[0-9a-f-]+\.config$ ]] || exit 1
          git config --file "$credentials_config" --unset-all http.https://github.com/.extraheader
      - name: Retain diagnostic native output and evidence; never a delivery artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-cf-${{ matrix.slug }}-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/existing-fleet-cloudflare/${{ matrix.slug }}/${{ matrix.key }}/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
