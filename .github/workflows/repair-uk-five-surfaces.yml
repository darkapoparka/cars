name: Repair five UK demo surfaces
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: cars-uk-five-source-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'darkapoparka/cars' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /templates.lock.json
            /catalog.json
            /workspace.json
            /docs/DEPLOYMENT-INVENTORY.json
            /leads/uk-2026-10-10-build-manifest.json
            /clients/batley-as-motor-group/
            /clients/stockport-broadbent-car-and-servicing/
            /clients/motherwell-motors-castle/
            /clients/birmingham-trade-car-sales-grasmere/
            /clients/birmingham-square-one-motors/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Install the retained raster encoder in an isolated runtime directory
        run: npm install --prefix runtime/uk-surface-tools --ignore-scripts --no-audit --no-fund sharp@0.35.5
      - name: Test strict source transformations
        run: node --test scripts/repair-uk-five-surfaces.test.mjs
      - name: Correct exact existing dealer sources and verify their seals
        run: |
          for dealer in batley-as-motor-group stockport-broadbent-car-and-servicing motherwell-motors-castle birmingham-trade-car-sales-grasmere birmingham-square-one-motors; do
            node --max-old-space-size=4096 scripts/repair-uk-five-surfaces.mjs "$dealer"
          done
      - name: Publish only the five corrected dealer prefixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse --force clients/batley-as-motor-group clients/stockport-broadbent-car-and-servicing clients/motherwell-motors-castle clients/birmingham-trade-car-sales-grasmere clients/birmingham-square-one-motors
          git diff --cached --name-only > runtime/uk-five-changed-paths.txt
          node --input-type=module -e "import fs from 'node:fs';import {UK_FIVE} from './scripts/repair-uk-five-surfaces.mjs';const names=fs.readFileSync('runtime/uk-five-changed-paths.txt','utf8').trim().split('\n');if(!names.length||names.some(n=>!UK_FIVE.some(s=>n.startsWith('clients/'+s+'/'))))throw Error('Commit escaped five-dealer scope');"
          git commit -m 'Repair UK five dealer logo surfaces and Modern missing-contact runtime'
          git fetch --filter=blob:none --no-tags origin main
          git rebase origin/main
          git push origin HEAD:main
          git rev-parse HEAD > runtime/uk-five-repair-commit.txt
      - name: Start fresh verified six-design builds for each repaired dealer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dealer in batley-as-motor-group stockport-broadbent-car-and-servicing motherwell-motors-castle birmingham-trade-car-sales-grasmere birmingham-square-one-motors; do
            gh workflow run build-uk-cloudflare.yml --ref main -f dealer="$dealer" -f qualification_runs=38084379432
          done
      - name: Retain repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uk-five-surface-repair-${{ github.run_id }}
          include-hidden-files: true
          path: |
            runtime/uk-five-changed-paths.txt
            runtime/uk-five-repair-commit.txt
            clients/*/.client/surface-repair-20261011.json
          retention-days: 7
