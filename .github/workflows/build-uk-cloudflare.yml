name: Build UK dealer for Cloudflare
on:
  workflow_dispatch:
    inputs:
      dealer:
        description: Compile one committed six-design dealer; no Cloudflare deployment
        required: true
        type: choice
        default: stockport-broadbent-car-and-servicing
        options:
          - batley-as-motor-group
          - birmingham-square-one-motors
          - birmingham-trade-car-sales-grasmere
          - bradford-cherry-tree-cars
          - dewsbury-car-market-yorkshire
          - motherwell-motors-castle
          - north-norfolk-car-sales
          - nottingham-s-a-motors
          - stockport-broadbent-car-and-servicing
          - stockton-norton-grange-trade-cars
      qualification_runs:
        description: Comma-separated manual qualification runs whose exact passed receipts cover all six families
        required: true
        type: string
        default: '38041380562,38042594609,38043025503'
permissions:
  contents: read
  actions: read
concurrency:
  group: cars-uk-cloudflare-${{ inputs.dealer }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'darkapoparka/cars' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /leads/uk-2026-10-10-build-manifest.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - id: matrix
        name: Select six applications and their router
        env:
          UK_DEALER: ${{ inputs.dealer }}
        run: node scripts/build-uk-cloudflare.mjs matrix "$UK_DEALER" >> "$GITHUB_OUTPUT"
  prepare:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact source and adapter commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /.gitignore
            /.gitattributes
            /templates.lock.json
            /catalog.json
            /workspace.json
            /scripts/
            /.github/workflows/
            /docs/DEPLOYMENT-INVENTORY.json
            /docs/qa/uk-approved-six-selection-2026-10-10.json
            /leads/uk-2026-10-10-build-manifest.json
            /leads/uk-2026-10-10-briefs/gb-${{ inputs.dealer }}/
            /clients/${{ inputs.dealer }}/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Verify qualification receipts and create one sealed package transport
        env:
          UK_DEALER: ${{ inputs.dealer }}
          UK_QUALIFICATION_RUNS: ${{ inputs.qualification_runs }}
          GH_TOKEN: ${{ github.token }}
          WRANGLER_SEND_METRICS: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
        run: node scripts/build-uk-cloudflare.mjs prepare "$UK_DEALER" "$UK_QUALIFICATION_RUNS"
      - name: Retain the exact package tree and thin Git bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uk-cloudflare-source-${{ inputs.dealer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/uk-cloudflare-builds/${{ github.run_id }}-${{ github.run_attempt }}/${{ inputs.dealer }}/source-artifact/
          include-hidden-files: true
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - name: Retain package preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uk-cloudflare-preparation-${{ inputs.dealer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/uk-cloudflare-builds/${{ github.run_id }}-${{ github.run_attempt }}/${{ inputs.dealer }}/receipts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  compile:
    needs: [plan, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Compile ${{ matrix.key }} with Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /templates.lock.json
            /leads/uk-2026-10-10-build-manifest.json
            /clients/${{ inputs.dealer }}/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: uk-cloudflare-source-${{ inputs.dealer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/uk-cloudflare-input/${{ inputs.dealer }}/
      - name: Restore identical sealed source, compile and dry-run one target
        env:
          UK_DEALER: ${{ inputs.dealer }}
          UK_TARGET: ${{ matrix.key }}
          WRANGLER_SEND_METRICS: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
        run: node scripts/build-uk-cloudflare.mjs compile "$UK_DEALER" "$UK_TARGET"
      - name: Retain compiled files and exact deployment contract
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uk-cloudflare-compiled-${{ inputs.dealer }}-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/uk-cloudflare-builds/${{ github.run_id }}-${{ github.run_attempt }}/${{ inputs.dealer }}/targets/${{ matrix.key }}/artifact/
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3
      - name: Retain compact per-target build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uk-cloudflare-evidence-${{ inputs.dealer }}-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/uk-cloudflare-builds/${{ github.run_id }}-${{ github.run_attempt }}/${{ inputs.dealer }}/targets/${{ matrix.key }}/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  summarize:
    needs: [plan, prepare, compile]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /leads/uk-2026-10-10-build-manifest.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: uk-cloudflare-evidence-${{ inputs.dealer }}-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/uk-cloudflare-evidence/${{ inputs.dealer }}/
      - name: Check all seven compiled outputs use the same sealed package
        env:
          UK_DEALER: ${{ inputs.dealer }}
        run: node scripts/build-uk-cloudflare.mjs summary "$UK_DEALER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uk-cloudflare-review-${{ inputs.dealer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/uk-cloudflare-summary/${{ inputs.dealer }}/
          if-no-files-found: error
          retention-days: 7
