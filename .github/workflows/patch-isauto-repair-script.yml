name: Patch IS AUTO repair script

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-isauto-repair-script.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts/repair-isauto-template-integrity.mjs
      - name: Replace obsolete asset list with current template directories
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          target = Path('scripts/repair-isauto-template-integrity.mjs')
          text = target.read_text(encoding='utf-8').replace('\r\n', '\n')
          start = text.index('const autoBestGenericArtwork = [')
          end_marker = "await fs.rm(path.join(AUTO_BEST, 'static', 'auto-best-icon.svg'), { force: true });"
          end = text.index(end_marker, start)
          replacement = """const autoBestGenericDirectories = [
            'assets/images/icon-box',
            'assets/images/partner',
            'assets/images/brand-curated',
            'assets/images/template'
          ];
          for (const relative of autoBestGenericDirectories) {
            const source = path.join(AUTO_BEST_TEMPLATE, 'static', relative);
            if (await exists(source)) {
              await copyDirectory(source, path.join(AUTO_BEST, 'static', relative));
            }
          }
          """
          target.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          node --check scripts/repair-isauto-template-integrity.mjs
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/repair-isauto-template-integrity.mjs
          git commit -m 'Sync IS AUTO presentation assets from approved template'
          git push origin HEAD:main
