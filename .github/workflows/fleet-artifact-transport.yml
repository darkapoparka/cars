name: Sealed fleet artifact byte transport
on:
  push:
    branches: [main]
    paths: [docs/releases/cloudflare-existing25-20261011/artifact-transport-request.json]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
concurrency:
  group: cars-fleet-artifact-transport
  cancel-in-progress: false
jobs:
  transport:
    if: github.repository == 'darkapoparka/cars' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed transport tools and request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/workflows/fleet-artifact-transport.yml
            /docs/releases/cloudflare-existing25-20261011/artifact-transport-request.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Check immutable identity, byte splitting and transport bounds
        run: node --test scripts/transport-fleet-artifact.test.mjs
      - name: Download and split the original ZIP bytes with ephemeral read authentication
        id: transport
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/transport-fleet-artifact.mjs
      - name: Upload raw original ZIP byte part 001
        if: success() && fromJSON(steps.transport.outputs.chunk_count) >= 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.transport.outputs.artifact_prefix }}-part-001
          path: ${{ steps.transport.outputs.output_dir }}/chunks/part-001.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload raw original ZIP byte part 002
        if: success() && fromJSON(steps.transport.outputs.chunk_count) >= 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.transport.outputs.artifact_prefix }}-part-002
          path: ${{ steps.transport.outputs.output_dir }}/chunks/part-002.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload raw original ZIP byte part 003
        if: success() && fromJSON(steps.transport.outputs.chunk_count) >= 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.transport.outputs.artifact_prefix }}-part-003
          path: ${{ steps.transport.outputs.output_dir }}/chunks/part-003.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload raw original ZIP byte part 004
        if: success() && fromJSON(steps.transport.outputs.chunk_count) >= 4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.transport.outputs.artifact_prefix }}-part-004
          path: ${{ steps.transport.outputs.output_dir }}/chunks/part-004.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload raw original ZIP byte part 005
        if: success() && fromJSON(steps.transport.outputs.chunk_count) >= 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.transport.outputs.artifact_prefix }}-part-005
          path: ${{ steps.transport.outputs.output_dir }}/chunks/part-005.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload raw original ZIP byte part 006
        if: success() && fromJSON(steps.transport.outputs.chunk_count) >= 6
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.transport.outputs.artifact_prefix }}-part-006
          path: ${{ steps.transport.outputs.output_dir }}/chunks/part-006.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload raw original ZIP byte part 007
        if: success() && fromJSON(steps.transport.outputs.chunk_count) >= 7
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.transport.outputs.artifact_prefix }}-part-007
          path: ${{ steps.transport.outputs.output_dir }}/chunks/part-007.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload raw original ZIP byte part 008
        if: success() && fromJSON(steps.transport.outputs.chunk_count) >= 8
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.transport.outputs.artifact_prefix }}-part-008
          path: ${{ steps.transport.outputs.output_dir }}/chunks/part-008.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload raw original ZIP byte part 009
        if: success() && fromJSON(steps.transport.outputs.chunk_count) >= 9
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.transport.outputs.artifact_prefix }}-part-009
          path: ${{ steps.transport.outputs.output_dir }}/chunks/part-009.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload raw original ZIP byte part 010
        if: success() && fromJSON(steps.transport.outputs.chunk_count) >= 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.transport.outputs.artifact_prefix }}-part-010
          path: ${{ steps.transport.outputs.output_dir }}/chunks/part-010.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain verified compact original identity and chunk SHA manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.transport.outputs.artifact_prefix }}-manifest
          path: ${{ steps.transport.outputs.output_dir }}/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
