name: Varna six-design candidate builds
on:
  push:
    branches: [varna]
    paths: [leads/varna/candidates/build-request.json]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: cars-varna-candidate-builds
  cancel-in-progress: true
jobs:
  plan:
    if: github.repository == 'darkapoparka/cars' && github.ref == 'refs/heads/varna'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /leads/varna/selected-10.json
            /leads/varna/candidates/build-request.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
      - id: matrix
        run: node scripts/varna-ci-build.mjs matrix >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    name: ${{ matrix.slug }} / ${{ matrix.key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DEALER_SLUG: ${{ matrix.slug }}
      DEALER_FAMILY: ${{ matrix.key }}
      SOURCE_COMMIT: ${{ github.sha }}
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4608
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /leads/varna/selected-10.json
            /leads/varna/candidates/build-request.json
            /clients/${{ matrix.slug }}/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Install isolated, pinned image and metadata tooling
        run: |
          mkdir -p runtime/varna-tools
          printf '{"private":true}\n' > runtime/varna-tools/package.json
          npm install --prefix runtime/varna-tools --ignore-scripts --save-exact sharp@0.35.5 typescript@6.0.3
      - name: Assemble exact-source six-design candidate and shared FAB
        run: |
          mkdir -p "runtime/varna-ci-evidence/$DEALER_SLUG"
          node scripts/varna-ci-build.mjs assemble "$DEALER_SLUG" "$SOURCE_COMMIT" 2>&1 | tee "runtime/varna-ci-evidence/$DEALER_SLUG/assembly.log"
      - name: Compile the real selected template with its generated hosting configuration
        run: node scripts/varna-ci-build.mjs build "$DEALER_SLUG" "$DEALER_FAMILY" 2>&1 | tee "runtime/varna-ci-evidence/$DEALER_SLUG/$DEALER_FAMILY-build.log"
      - name: Retain build receipts and errors, not an invented release approval
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: varna-${{ matrix.slug }}-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/varna-ci-evidence/${{ matrix.slug }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7