name: Fix IS AUTO all-white surface logo

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-isauto-modern-logo-contrast.yml"

permissions:
  contents: write

concurrency:
  group: fix-isauto-white-surface-logo
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/refine-isauto-raster-logo.mjs
            /.github/workflows/build-isauto-varna.yml
            /.github/workflows/fix-isauto-modern-logo-contrast.yml

      - name: Generate a true all-white logo for red and dark surfaces
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'scripts/refine-isauto-raster-logo.mjs',
              "const PIPELINE_VERSION = 'official-wordmark-v2';",
              "const PIPELINE_VERSION = 'official-wordmark-v4-full-white-surface-contrast';"
          )
          replace_once(
              'scripts/refine-isauto-raster-logo.mjs',
              '      target = TARGET_RED;',
              "      target = mode === 'light' ? TARGET_LIGHT : TARGET_RED;"
          )
          replace_once(
              'scripts/refine-isauto-raster-logo.mjs',
              "      'The official IS AUTO website wordmark is converted into tightly framed transparent dark/light PNG masters with WebP archive derivatives. No SVG, CSS wordmark, generated text, App Store crop, or boxed background is used at runtime.'",
              "      'The official IS AUTO website wordmark is converted into tightly framed transparent raster masters: the light-surface version keeps the red/dark identity, while the red/dark-surface version is fully white for reliable contrast. PNG runtime assets and WebP derivatives are generated; no SVG, CSS wordmark, generated text, App Store crop, or boxed background is used.'"
          )
          replace_once(
              'scripts/refine-isauto-raster-logo.mjs',
              "const lightGeometry = await renderLogo(\n  'light',\n  lightMaster,\n  path.join(generatedRoot, 'isauto-logo-light.webp')\n);",
              "const lightGeometry = await renderLogo(\n  'light',\n  lightMaster,\n  path.join(generatedRoot, 'isauto-logo-light.webp')\n);\n\nconst { data: lightPixels } = await sharp(lightMaster)\n  .ensureAlpha()\n  .raw()\n  .toBuffer({ resolveWithObject: true });\nfor (let index = 0; index < lightPixels.length; index += 4) {\n  const alpha = lightPixels[index + 3];\n  if (alpha < 8) continue;\n  if (lightPixels[index] < 245 || lightPixels[index + 1] < 245 || lightPixels[index + 2] < 245) {\n    throw new Error('IS AUTO light logo must contain only white visible pixels.');\n  }\n}"
          )
          replace_once(
              '.github/workflows/build-isauto-varna.yml',
              "    if: github.actor != 'github-actions[bot]'",
              "    if: github.actor != 'github-actions[bot]' || contains(github.event.head_commit.message, '[rebuild-isauto]')"
          )
          PY

          node --check scripts/refine-isauto-raster-logo.mjs
          grep -Fq "target = mode === 'light' ? TARGET_LIGHT : TARGET_RED;" scripts/refine-isauto-raster-logo.mjs
          grep -Fq "IS AUTO light logo must contain only white visible pixels." scripts/refine-isauto-raster-logo.mjs
          grep -Fq "contains(github.event.head_commit.message, '[rebuild-isauto]')" .github/workflows/build-isauto-varna.yml
          git diff --check

      - name: Commit canonical contrast repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-isauto-modern-logo-contrast.yml
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'main moved during validation; refusing to overwrite' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/refine-isauto-raster-logo.mjs \
            .github/workflows/build-isauto-varna.yml \
            .github/workflows/fix-isauto-modern-logo-contrast.yml
          git commit -m '[rebuild-isauto] Use full-white IS AUTO logo on red and dark surfaces'
          git push origin HEAD:main
