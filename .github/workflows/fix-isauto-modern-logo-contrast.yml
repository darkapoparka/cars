name: Commit IS AUTO raster logo variants

on:
  # Dealer publishing and historical repair runs require explicit dispatch.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-isauto-raster-logo-variants
  cancel-in-progress: true

jobs:
  assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/refine-isauto-raster-logo.mjs
            /clients/isauto-varna/assets/provenance.json
            /clients/isauto-varna/auto-best/static/assets/images/lead/isauto/
            /clients/isauto-varna/modern/apps/web/public/isauto/
            /clients/isauto-varna/carwow/static/brand/

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install isolated raster tooling
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/isauto-image-tools" sharp@0.35.1 --no-audit --no-fund

      - name: Generate and validate official surface variants
        shell: bash
        env:
          IS_AUTO_SHARP_ROOT: ${{ runner.temp }}/isauto-image-tools
        run: |
          set -euo pipefail
          node scripts/refine-isauto-raster-logo.mjs
          git diff --check

      - name: Commit generated PNG and WebP assets to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse \
            clients/isauto-varna/assets/provenance.json \
            clients/isauto-varna/auto-best/static/assets/images/lead/isauto/logo-dark.png \
            clients/isauto-varna/auto-best/static/assets/images/lead/isauto/logo-light.png \
            clients/isauto-varna/auto-best/static/assets/images/lead/isauto/logo-dark.webp \
            clients/isauto-varna/auto-best/static/assets/images/lead/isauto/logo-light.webp \
            clients/isauto-varna/modern/apps/web/public/isauto/logo-dark.png \
            clients/isauto-varna/modern/apps/web/public/isauto/logo-light.png \
            clients/isauto-varna/modern/apps/web/public/isauto/logo-dark.webp \
            clients/isauto-varna/modern/apps/web/public/isauto/logo-light.webp \
            clients/isauto-varna/carwow/static/brand/isauto-logo-dark.png \
            clients/isauto-varna/carwow/static/brand/isauto-logo-light.png \
            clients/isauto-varna/carwow/static/brand/isauto-logo-dark.webp \
            clients/isauto-varna/carwow/static/brand/isauto-logo-light.webp
          if git diff --cached --quiet; then
            echo 'IS AUTO raster assets already match the validated generator.'
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'main moved during asset validation; refusing to overwrite' >&2
            exit 1
          fi
          git commit -m 'Commit full-white IS AUTO raster surface variants'
          git push origin HEAD:main
