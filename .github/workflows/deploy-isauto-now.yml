name: Deploy corrected IS AUTO production package now

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-isauto-now.yml"

permissions:
  contents: read

concurrency:
  group: deploy-isauto-varna-production
  cancel-in-progress: true

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-isauto-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified deployment package
        uses: actions/checkout@v4
        with:
          ref: publish/isauto-varna
          fetch-depth: 1

      - name: Deploy package to existing Vercel production project
        id: vercel
        uses: amondnet/vercel-action@v25
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_RTNXBnClGWDdcYFFUW0BnqvJ
          vercel-project-id: prj_8k5z9l4jyDCcoEfaaLBiyH1GbRVv
          vercel-args: --prod
          scope: team_RTNXBnClGWDdcYFFUW0BnqvJ

      - name: Verify live production alias and raster logo variants
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            html="$(curl -fsSL --max-time 20 https://cars-isautovarna.vercel.app/ || true)"
            dark_headers="$(curl -fsSIL --max-time 20 https://cars-isautovarna.vercel.app/dealer/logo-dark.png || true)"
            light_headers="$(curl -fsSIL --max-time 20 https://cars-isautovarna.vercel.app/dealer/logo-light.png || true)"
            modern_light_headers="$(curl -fsSIL --max-time 20 https://cars-isautovarna.vercel.app/variant-2/isauto/logo-light.png || true)"
            if printf '%s' "$html" | grep -q '/dealer/logo-dark.png' && \
               printf '%s' "$html" | grep -q 'IS AUTO' && \
               printf '%s' "$dark_headers" | grep -Eqi '^content-type: image/(png|webp)' && \
               printf '%s' "$light_headers" | grep -Eqi '^content-type: image/(png|webp)' && \
               printf '%s' "$modern_light_headers" | grep -Eqi '^content-type: image/(png|webp)'; then
              echo 'Production alias serves the refreshed IS AUTO package and both raster contrast variants.'
              exit 0
            fi
            sleep 4
          done
          echo 'Production alias did not expose the refreshed IS AUTO logo package.' >&2
          exit 1
