name: Deploy verified IS AUTO package now

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-isauto-now.yml

permissions:
  contents: write

concurrency:
  group: deploy-isauto-varna-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified deployment package
        uses: actions/checkout@v4
        with:
          ref: publish/isauto-varna
          fetch-depth: 1

      - name: Deploy package to existing Vercel production project
        uses: amondnet/vercel-action@v25
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_RTNXBnClGWDdcYFFUW0BnqvJ
          vercel-project-id: prj_8k5z9l4jyDCcoEfaaLBiyH1GbRVv
          vercel-args: --prod
          scope: team_RTNXBnClGWDdcYFFUW0BnqvJ

      - name: Verify production routes and repaired assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://cars-isautovarna.vercel.app'
          paths=(
            '/'
            '/variant-2/cars'
            '/variant-3/'
            '/dealer/logo-dark.png'
            '/dealer/logo-light.png'
            '/dealer/inventory-1.webp'
            '/variant-2/images/services/header-car-v1.png'
            '/variant-2/images/services/header-filters-v1.png'
            '/variant-3/brand/isauto-logo-light.png'
            '/variant-3/brand/isauto-logo-dark.png'
            '/variant-3/assets/isauto/inventory-1.webp'
          )
          for attempt in $(seq 1 30); do
            failed=0
            for path in "${paths[@]}"; do
              if ! curl -fsSL --max-time 25 -o /dev/null "${base}${path}"; then
                echo "Waiting for ${path}"
                failed=1
                break
              fi
            done
            html="$(curl -fsSL --max-time 25 "${base}/" || true)"
            if [ "$failed" -eq 0 ] && printf '%s' "$html" | grep -q '/dealer/logo-dark.png' && printf '%s' "$html" | grep -q 'IS AUTO'; then
              echo 'Production alias serves all repaired IS AUTO routes and assets.'
              exit 0
            fi
            sleep 4
          done
          echo 'Production alias did not expose the complete repaired IS AUTO package.' >&2
          exit 1

  cleanup:
    if: always() && github.actor != 'github-actions[bot]'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-time deployment workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/deploy-isauto-now.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-isauto-now.yml
          git commit -m 'Remove one-time IS AUTO deployment workflow'
          git push origin HEAD:main
