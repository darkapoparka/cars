name: Transport retained source objects
on:
  push:
    branches: [main]
    paths:
      - docs/releases/cloudflare-existing25-20261011/retained-source-transport-request.json
      - scripts/compact-retained-source.mjs
      - .github/workflows/transport-retained-source.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: cars-retained-source-object-transport
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/compact-retained-source.mjs
            docs/releases/cloudflare-existing25-20261011/retained-source-transport-request.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
      - id: plan
        run: echo "matrix=$(node scripts/compact-retained-source.mjs matrix)" >> "$GITHUB_OUTPUT"
  compact:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/compact-retained-source.mjs
            docs/releases/cloudflare-existing25-20261011/retained-source-transport-request.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
      - id: compact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/compact-retained-source.mjs compact ${{ matrix.dealer }}
      - uses: actions/upload-artifact@v4
        with:
          name: retained-source-objects-${{ matrix.dealer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.compact.outputs.directory }}
          compression-level: 6
          retention-days: 7
