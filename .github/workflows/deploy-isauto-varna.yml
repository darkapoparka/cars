name: Deploy IS AUTO Varna production

on:
  push:
    branches:
      - publish/isauto-varna
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-isauto-varna-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified deployment package
        uses: actions/checkout@v4
        with:
          ref: publish/isauto-varna
          fetch-depth: 1

      - name: Deploy package to existing Vercel production project
        id: vercel
        uses: amondnet/vercel-action@v25
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_RTNXBnClGWDdcYFFUW0BnqvJ
          vercel-project-id: prj_8k5z9l4jyDCcoEfaaLBiyH1GbRVv
          vercel-args: --prod
          scope: team_RTNXBnClGWDdcYFFUW0BnqvJ

      - name: Verify live production alias
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            html="$(curl -fsSL --max-time 20 https://cars-isautovarna.vercel.app/ || true)"
            if printf '%s' "$html" | grep -q '/dealer/logo-dark.png' && \
               printf '%s' "$html" | grep -q 'IS AUTO'; then
              echo 'Production alias serves the refreshed IS AUTO package.'
              exit 0
            fi
            sleep 3
          done
          echo 'Production alias did not expose the refreshed dealer package.' >&2
          exit 1
