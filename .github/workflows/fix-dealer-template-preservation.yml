name: Fix dealer template preservation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-dealer-template-preservation.yml

permissions:
  contents: read

concurrency:
  group: fix-dealer-template-preservation
  cancel-in-progress: false

jobs:
  targeted-focus:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Cars trigger
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            .github/workflows/fix-dealer-template-preservation.yml

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'

      - name: Verify sticky dialog focus only
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-tags https://github.com/darkapoparka/cars-template-auto-best.git "$RUNNER_TEMP/cars-template-auto-best"
          git -C "$RUNNER_TEMP/cars-template-auto-best" checkout --detach a54af64f3d7b115e56f1fd016cadcb69de1472b8
          npm ci --no-audit --no-fund --prefix "$RUNNER_TEMP/cars-template-auto-best"
          npx --prefix "$RUNNER_TEMP/cars-template-auto-best" playwright install --with-deps chromium
          npm --prefix "$RUNNER_TEMP/cars-template-auto-best" run validate
          npm --prefix "$RUNNER_TEMP/cars-template-auto-best" run preview -- --host 127.0.0.1 --port 6461 > "$RUNNER_TEMP/auto-best-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6461/ >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:6461/ >/dev/null; then
            cat "$RUNNER_TEMP/auto-best-preview.log" >&2
            exit 1
          fi
          BASE_URL=http://127.0.0.1:6461 node "$RUNNER_TEMP/cars-template-auto-best/scripts/desktop-discovery-smoke.mjs"
