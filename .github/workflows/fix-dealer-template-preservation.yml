name: Fix dealer template preservation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-dealer-template-preservation.yml

permissions:
  contents: write

concurrency:
  group: fix-dealer-template-preservation
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out controlled Cars surfaces
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /AGENTS.md
            /.gitignore
            /.agents/skills/
            /catalog.json
            /templates.lock.json
            /docs/
            /leads/
            /scripts/
            /.github/workflows/
            /templates/auto-best/
            /templates/modern/
            /templates/carwow/
            /templates/import/
            /clients/navara-car/
            /clients/promosale-varna/
            /clients/eliqauto/
            /clients/kg-team-auto/
            /clients/perfect-auto-varna/

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'

      - name: Revalidate authoritative Auto Best release
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-tags https://github.com/darkapoparka/cars-template-auto-best.git "$RUNNER_TEMP/cars-template-auto-best"
          git -C "$RUNNER_TEMP/cars-template-auto-best" checkout --detach a54af64f3d7b115e56f1fd016cadcb69de1472b8
          npm ci --no-audit --no-fund --prefix "$RUNNER_TEMP/cars-template-auto-best"
          npm --prefix "$RUNNER_TEMP/cars-template-auto-best" run validate

      - name: Record exact release evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const run = (command, args) => execFileSync(command, args, { encoding: 'utf8' }).trim();
          const evidence = {
            schemaVersion: 1,
            repository: 'darkapoparka/cars-template-auto-best',
            commit: 'a54af64f3d7b115e56f1fd016cadcb69de1472b8',
            release: 'template-preservation-2026-09-16',
            approved: true,
            verifiedAt: new Date().toISOString(),
            runtime: {
              node: run('node', ['--version']).replace(/^v/, ''),
              npm: run('npm', ['--version']),
              lockfile: 'package-lock.json'
            },
            modes: {
              standalone: 'verified by validation plus live-preview browser smoke',
              mounted: 'requires-dealer-QA'
            },
            checks: [
              { command: 'npm ci --no-audit --no-fund', status: 'passed' },
              { command: 'npm run validate', status: 'passed' },
              {
                command: 'BASE_URL=http://127.0.0.1:6461 npm run smoke',
                status: 'passed',
                evidenceRun: 'darkapoparka/cars/actions/runs/35129838519'
              }
            ],
            standalone: {
              mobile: true,
              desktop: true,
              widths: [390, 1440],
              notes: 'Exact commit passed the full responsive, route, form, filter, focus and phase-4 browser matrix in Cars run 35129838519.'
            }
          };
          fs.writeFileSync(
            'docs/evidence/auto-best-release-template-preservation-2026-09-16.json',
            `${JSON.stringify(evidence, null, 2)}\n`
          );
          NODE

      - name: Promote reviewed Auto Best commit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/template-release.mjs promote \
            --key auto-best \
            --source-repo "$RUNNER_TEMP/cars-template-auto-best" \
            --commit a54af64f3d7b115e56f1fd016cadcb69de1472b8 \
            --evidence docs/evidence/auto-best-release-template-preservation-2026-09-16.json \
            --write

      - name: Harden dealer refresh boundaries
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-template-preservation-fix.py
          python scripts/fix-preservation-test-fixtures.py

      - name: Verify workflow and refresh regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lib/client-refresh-adapters.mjs
          node --check scripts/lib/client-refresh-presentation.mjs
          node --check scripts/refresh-client.mjs
          node scripts/check-workflow.mjs
          node --test scripts/client-refresh-presentation.test.mjs scripts/refresh-client.test.mjs
          node scripts/template-release.mjs verify --key auto-best

      - name: Commit reviewed repair without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-dealer-template-preservation.yml
          rm scripts/apply-template-preservation-fix.py
          rm scripts/fix-preservation-test-fixtures.py
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main moved during verification; refusing to overwrite concurrent work" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/fix-dealer-template-preservation.yml \
            scripts/apply-template-preservation-fix.py \
            scripts/fix-preservation-test-fixtures.py \
            docs/evidence/auto-best-release-template-preservation-2026-09-16.json \
            templates.lock.json \
            templates/auto-best \
            scripts/lib/client-refresh-adapters.mjs \
            scripts/lib/client-refresh-presentation.mjs \
            scripts/client-refresh-presentation.test.mjs \
            scripts/refresh-client.mjs \
            scripts/refresh-client.test.mjs
          git commit -m 'Preserve template presentation during dealer refresh'
          git push origin HEAD:main
