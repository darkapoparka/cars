name: Check publishing credentials

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-publishing-credentials.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report credential availability
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN != '' }}
          HAS_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_GH_PAT: ${{ secrets.GH_PAT != '' }}
          HAS_GITHUB_PAT: ${{ secrets.GITHUB_PAT != '' }}
          HAS_CARS_GITHUB_TOKEN: ${{ secrets.CARS_GITHUB_TOKEN != '' }}
          HAS_REPO_PAT: ${{ secrets.REPO_PAT != '' }}
        run: |
          printf 'VERCEL_TOKEN=%s\n' "$HAS_VERCEL_TOKEN"
          printf 'VERCEL_ACCESS_TOKEN=%s\n' "$HAS_VERCEL_ACCESS_TOKEN"
          printf 'VERCEL_ORG_ID=%s\n' "$HAS_VERCEL_ORG_ID"
          printf 'GH_PAT=%s\n' "$HAS_GH_PAT"
          printf 'GITHUB_PAT=%s\n' "$HAS_GITHUB_PAT"
          printf 'CARS_GITHUB_TOKEN=%s\n' "$HAS_CARS_GITHUB_TOKEN"
          printf 'REPO_PAT=%s\n' "$HAS_REPO_PAT"
