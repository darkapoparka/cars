name: Repair IS AUTO optional YouTube contract

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-autobest-optional-youtube.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/build-isauto-varna.mjs
            /.github/workflows/fix-autobest-optional-youtube.yml

      - name: Allow an unverified YouTube field to remain empty
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          target = Path('scripts/build-isauto-varna.mjs')
          text = target.read_text(encoding='utf-8')
          old = "  youtubeUrl: \\`https://\\${string}\\`;"
          new = "  youtubeUrl: \\`https://\\${string}\\` | '';"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one strict generated YouTube type, found {count}')
          target.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node --check scripts/build-isauto-varna.mjs
          grep -Fq "youtubeUrl: \`https://\${string}\` | '';" scripts/build-isauto-varna.mjs
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-autobest-optional-youtube.yml
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'main moved during validation; refusing to overwrite' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-isauto-varna.mjs .github/workflows/fix-autobest-optional-youtube.yml
          git commit -m 'Allow IS AUTO without an invented YouTube URL'
          git push origin HEAD:main
