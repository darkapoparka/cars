name: Repair generated Auto Best social contract

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-autobest-optional-youtube.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /templates/
            /clients/navara-car/
            /clients/promosale-varna/
            /clients/eliqauto/
            /clients/kg-team-auto/
            /clients/perfect-auto-varna/
            /.github/workflows/fix-autobest-optional-youtube.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Patch duplicated Auto Best brand contract
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          adapter = Path('scripts/lib/client-refresh-adapters.mjs')
          text = adapter.read_text(encoding='utf-8')
          old_type = "  youtubeUrl: \\`https://\\${string}\\`;"
          new_type = "  youtubeUrl: \\`https://\\${string}\\` | '';"
          old_value = "  youtubeUrl: ${q(social.youtube || 'https://www.youtube.com/')},"
          new_value = "  youtubeUrl: ${q(social.youtube || '')},"
          if text.count(old_type) != 1:
              raise SystemExit(f'expected one strict YouTube type, found {text.count(old_type)}')
          if text.count(old_value) != 1:
              raise SystemExit(f'expected one generic YouTube fallback, found {text.count(old_value)}')
          adapter.write_text(text.replace(old_type, new_type).replace(old_value, new_value), encoding='utf-8')

          test_file = Path('scripts/refresh-client.test.mjs')
          test = test_file.read_text(encoding='utf-8')
          anchor = "  assert.match(autoBestBrand, /Посещения с предварителна уговорка/);"
          addition = """  assert.match(autoBestBrand, /Посещения с предварителна уговорка/);
  assert.ok(autoBestBrand.includes(\"youtubeUrl: `https://${string}` | '';\"));
  assert.match(autoBestBrand, /youtubeUrl: \"\"/);
  assert.doesNotMatch(autoBestBrand, /https:\\/\\/www\\.youtube\\.com\\//);"""
          if test.count(anchor) != 1:
              raise SystemExit(f'expected one Auto Best brand assertion anchor, found {test.count(anchor)}')
          test_file.write_text(test.replace(anchor, addition), encoding='utf-8')
          PY
          node --check scripts/lib/client-refresh-adapters.mjs
          node --check scripts/refresh-client.test.mjs
          git diff --check
      - name: Run refresh regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/client-refresh-presentation.test.mjs scripts/refresh-client.test.mjs
      - name: Commit validated generator repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-autobest-optional-youtube.yml
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'main moved during validation; refusing to overwrite' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/lib/client-refresh-adapters.mjs \
            scripts/refresh-client.test.mjs \
            .github/workflows/fix-autobest-optional-youtube.yml
          git commit -m 'Allow dealers without a YouTube channel'
          git push origin HEAD:main
