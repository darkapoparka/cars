name: Priselci public browser complement
on:
  workflow_dispatch:
    inputs:
      request_sha256:
        description: Reviewed current Priselci hosted request raw SHA256
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: cars-priselci-public-browser-complement
  cancel-in-progress: false
jobs:
  browser:
    if: github.repository == 'darkapoparka/cars' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      QA_REQUEST_SHA256: ${{ inputs.request_sha256 }}
    steps:
      - name: Check out reviewed tools and original proof inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/workflows/priselci-public-browser-complement.yml
            /docs/releases/cloudflare-existing25-20261011/hosted-native-qa/
            /templates/auto-best/package.json
            /templates/auto-best/package-lock.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Check fixed pilot, route and geometry guards
        run: node --test scripts/verify-priselci-public-browser.test.mjs
      - name: Restore and authenticate exact S1 browser dependency inputs
        run: node scripts/verify-priselci-public-browser.mjs --prepare-source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install existing lockfile-pinned public browser runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/cars-hosted-native-browsers
        run: |
          npm ci --ignore-scripts --prefix templates/auto-best
          node templates/auto-best/node_modules/playwright/cli.js install --with-deps chromium
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Collect current three-family public journeys without business writes
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/cars-hosted-native-browsers
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-priselci-public-browser.mjs --run --sha256 "$QA_REQUEST_SHA256"
      - name: Retain compact geometry and six useful screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: priselci-public-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/priselci-public-browser-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
