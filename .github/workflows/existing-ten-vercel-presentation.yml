name: Existing Cars Vercel presentation release
on:
  push:
    branches: [main]
    paths: [docs/releases/vercel-presentation-20261011/request.json]
permissions:
  contents: read
concurrency:
  group: cars-existing-ten-vercel-presentation
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'darkapoparka/cars'
    runs-on: ubuntu-24.04
    outputs:
      dealers: ${{ steps.matrix.outputs.dealers }}
      pilots: ${{ steps.matrix.outputs.pilots }}
      legacy_native: ${{ steps.matrix.outputs.legacy_native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            docs/releases
            docs/DEPLOYMENT-INVENTORY.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Focused runner and true native qualification admission checks
        run: node --test --test-concurrency=1 scripts/vercel-refresh-runner.test.mjs scripts/vercel-preview-qualification.test.mjs
      - id: matrix
        shell: bash
        run: |
          node scripts/prepare-vercel-presentation-release.mjs matrix >> "$GITHUB_OUTPUT"
  package:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.dealers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0
          sparse-checkout: |
            scripts
            docs
            clients/${{ matrix.slug }}
      - name: Exact registered independent source, never a Cars-owned copy
        if: matrix.independent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.sourceRepository }}
          ref: ${{ matrix.sourceCommit }}
          token: ${{ secrets.CARS_PUBLISH_TOKEN }}
          persist-credentials: false
          path: runtime/independent-source/${{ matrix.slug }}
      - name: Bound generated package capacity on this remote runner
        run: |
          free="$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n 1)"
          [[ "$free" -ge 8589934592 ]] || { echo 'Remote runner has less than 8 GiB available'; exit 1; }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Isolated share tooling; no template or dealer dependency edits
        run: |
          mkdir -p runtime/vercel-tools
          printf '{"private":true}\n' > runtime/vercel-tools/package.json
          npm install --prefix runtime/vercel-tools --ignore-scripts --save-exact sharp@0.35.5 typescript@6.0.3
      - name: Existing package-dealer with shared fixes and thin verified Git transport
        env:
          NODE_PATH: ${{ github.workspace }}/runtime/vercel-tools/node_modules
          NODE_OPTIONS: --max-old-space-size=6144
          CARS_PUBLISH_TOKEN: ${{ secrets.CARS_PUBLISH_TOKEN }}
          GIT_AUTHOR_NAME: Cars release
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: Cars release
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node scripts/prepare-vercel-presentation-release.mjs prepare '${{ matrix.slug }}'
      - name: Retain exact error receipt without environment or credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vercel-diagnostic-${{ matrix.slug }}-${{ github.run_id }}
          path: |
            runtime/vercel-presentation/${{ matrix.slug }}/diagnostic.json
            runtime/vercel-presentation/${{ matrix.slug }}/package-cli.log
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vercel-package-${{ matrix.slug }}-${{ github.run_id }}
          path: runtime/vercel-presentation/${{ matrix.slug }}/artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  native:
    if: needs.plan.outputs.legacy_native == 'true'
    needs: [plan, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.pilots) }}
    name: Native ${{ matrix.slug }} / ${{ matrix.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            docs/releases/vercel-presentation-20261011
            clients/${{ matrix.slug }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: vercel-package-${{ matrix.slug }}-${{ github.run_id }}
          path: input/package
      - name: Compile exact generated Vercel service and retain receipt
        env:
          NODE_OPTIONS: --max-old-space-size=4608
          NEXT_TELEMETRY_DISABLED: '1'
        run: node scripts/prepare-vercel-presentation-release.mjs native '${{ matrix.slug }}' '${{ matrix.key }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.slug }}-${{ matrix.key }}-${{ github.run_id }}
          path: runtime/vercel-presentation/${{ matrix.slug }}/native-${{ matrix.key }}.json
          if-no-files-found: error
          retention-days: 7
