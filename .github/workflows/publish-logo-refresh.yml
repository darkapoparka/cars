name: Publish branch contextual logo refresh
on:
  push:
    branches: ['publish/asko-96']
    paths: ['.github/workflows/publish-logo-refresh.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-logo-refresh-asko-96
  cancel-in-progress: false
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --prefix "$RUNNER_TEMP/logo-tools" sharp@0.35.1 --no-audit --no-fund
      - name: Refresh all three variants
        env:
          CARS_LOGO_SHARP_ROOT: ${{ runner.temp }}/logo-tools
          DEALER_SLUG: asko-96
          IDENTITY_STRATEGY: USE GENERATED CANDIDATE
          IDENTITY_RATIONALE: Preserve the approved dealer identity candidate and apply contextual transparent raster variants across all three designs.
        run: |
          curl -fsSL https://raw.githubusercontent.com/darkapoparka/cars/main/docs/logo-refresh/2026-09-18/tools/refresh-deployment-repo.mjs -o "$RUNNER_TEMP/refresh-deployment-repo.mjs"
          curl -fsSL https://raw.githubusercontent.com/darkapoparka/cars/main/docs/logo-refresh/2026-09-18/tools/run-deployment-logo-refresh.sh -o "$RUNNER_TEMP/run-deployment-logo-refresh.sh"
          chmod +x "$RUNNER_TEMP/run-deployment-logo-refresh.sh"
          TOOL_SCRIPT="$RUNNER_TEMP/refresh-deployment-repo.mjs" "$RUNNER_TEMP/run-deployment-logo-refresh.sh"
