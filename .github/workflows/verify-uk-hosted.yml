name: Verify hosted UK dealer in Chromium
on:
  workflow_dispatch:
    inputs:
      dealer:
        description: Public Cloudflare dealer to inspect; all six designs and two viewport widths
        required: true
        type: choice
        default: stockport-broadbent-car-and-servicing
        options:
          - batley-as-motor-group
          - birmingham-square-one-motors
          - birmingham-trade-car-sales-grasmere
          - bradford-cherry-tree-cars
          - dewsbury-car-market-yorkshire
          - motherwell-motors-castle
          - north-norfolk-car-sales
          - nottingham-s-a-motors
          - stockport-broadbent-car-and-servicing
          - stockton-norton-grange-trade-cars
      source_commit:
        description: Exact canonical Cars source commit from the deployed package receipt
        required: true
        type: string
      published_commit:
        description: Exact private main commit from the verified publication receipt
        required: true
        type: string
      package_digest:
        description: Exact package digest shared by all seven deployed targets
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cars-uk-hosted-qa-${{ inputs.dealer }}
  cancel-in-progress: false
jobs:
  browser:
    if: github.repository == 'darkapoparka/cars' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      UK_DEALER: ${{ inputs.dealer }}
      UK_SOURCE_COMMIT: ${{ inputs.source_commit }}
      UK_PUBLISHED_COMMIT: ${{ inputs.published_commit }}
      UK_PACKAGE_DIGEST: ${{ inputs.package_digest }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the exact checker without any dealer application copy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/verify-uk-hosted.mjs
            /scripts/verify-uk-hosted.test.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Fetch only the named immutable source and approved browser-tooling commit
        shell: bash
        run: |
          [[ "$UK_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$UK_PUBLISHED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$UK_PACKAGE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          git fetch --no-tags --filter=blob:none --depth=1 origin "$UK_SOURCE_COMMIT"
          git fetch --no-tags --filter=blob:none --depth=1 origin 2afd974c23d4f4cfb290ed99a00f46074793be3a
      - name: Verify source facts and extract the exact approved package and lock
        run: node scripts/verify-uk-hosted.mjs prepare "$UK_DEALER" "$UK_SOURCE_COMMIT" "$UK_PUBLISHED_COMMIT" "$UK_PACKAGE_DIGEST"
      - name: Install the existing locked browser tools in the ephemeral runner
        shell: bash
        run: |
          npm --prefix "$UK_QA_ROOT/tooling" ci --ignore-scripts --include=dev --no-audit --no-fund
          node "$UK_QA_ROOT/tooling/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise and capture the actual public six-design preview
        run: node scripts/verify-uk-hosted.mjs run "$UK_QA_ROOT/plan.json"
      - name: Retain screenshots, result details and source/tooling provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uk-hosted-browser-${{ inputs.dealer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/uk-hosted-qa/${{ github.run_id }}-${{ github.run_attempt }}/${{ inputs.dealer }}/evidence/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
