name: Transport UK Cloudflare source
on:
  workflow_dispatch:
    inputs:
      build_run_ids:
        description: Completed latest UK Cloudflare build run IDs, comma separated; no new build or deployment
        required: true
        type: string
        default: '38087053295'
permissions:
  contents: write
  actions: read
concurrency:
  group: cars-uk-verified-source-transport
  cancel-in-progress: false
jobs:
  transport:
    if: github.repository == 'darkapoparka/cars' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/transport-uk-cloudflare-source.mjs
            /scripts/
            /leads/uk-2026-10-10-build-manifest.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Verify original successful artifacts and publish immutable non-branch source refs
        env:
          GH_TOKEN: ${{ github.token }}
          UK_BUILD_RUNS: ${{ inputs.build_run_ids }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: node .github/scripts/transport-uk-cloudflare-source.mjs
      - name: Retain original transport metadata and actual source-ref evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uk-git-source-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/uk-git-source-transport/${{ github.run_id }}-${{ github.run_attempt }}/summary.json
            runtime/uk-git-source-transport/${{ github.run_id }}-${{ github.run_attempt }}/proof-*/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
