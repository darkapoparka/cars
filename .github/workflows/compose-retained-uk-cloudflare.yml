name: Compose retained UK native builds
on:
  push:
    branches: [main]
    paths:
      - docs/releases/cloudflare-existing25-20261011/retained-uk-compose-request.json
permissions:
  contents: read
  actions: read
concurrency:
  group: retained-uk-native-composition
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            docs/releases/cloudflare-existing25-20261011/retained-uk-compose-request.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.10.0
      - id: plan
        run: echo "matrix=$(node scripts/compose-retained-uk-native.mjs matrix)" >> "$GITHUB_OUTPUT"
  compose:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NODE_OPTIONS: --max-old-space-size=4608
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            docs/releases/cloudflare-existing25-20261011/retained-uk-compose-request.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.10.0
      - name: Install the existing composer dependency
        run: |
          mkdir -p .tooling
          printf '{"private":true}\n' > .tooling/package.json
          npm install --prefix .tooling --save-exact esbuild@0.28.2
      - id: compose
        env:
          DEALER: ${{ matrix.dealer }}
        run: node scripts/compose-retained-uk-native.mjs compose "$DEALER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-uk-single-worker-${{ matrix.dealer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.compose.outputs.directory }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

