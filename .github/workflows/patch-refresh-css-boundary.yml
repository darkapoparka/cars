name: Patch Auto Best generated contact type

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-refresh-css-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts/lib/client-refresh-adapters.mjs
      - name: Export the contact topic ID used by shell data
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          target = Path('scripts/lib/client-refresh-adapters.mjs')
          text = target.read_text(encoding='utf-8').replace('\r\n', '\n')
          old = "type ContactTopicId = 'general' | 'inspection' | 'import' | 'leasing' | 'trade-in';"
          new = "export type ContactTopicId = 'general' | 'inspection' | 'import' | 'leasing' | 'trade-in';"
          if text.count(old) != 1:
              raise SystemExit(f'expected one ContactTopicId declaration, found {text.count(old)}')
          target.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node --check scripts/lib/client-refresh-adapters.mjs
      - name: Commit generated data contract fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/lib/client-refresh-adapters.mjs
          git commit -m 'Export generated Auto Best contact topic type'
          git push origin HEAD:main
