name: Patch IS AUTO generator CSS boundary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-refresh-css-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts/build-isauto-varna.mjs
      - name: Keep dealer text replacement out of all template stylesheets
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          target = Path('scripts/build-isauto-varna.mjs')
          text = target.read_text(encoding='utf-8').replace('\r\n', '\n')
          old = "const textExtensions = new Set(['.ts', '.tsx', '.js', '.mjs', '.svelte', '.json', '.md', '.css', '.html']);"
          new = "const textExtensions = new Set(['.ts', '.tsx', '.js', '.mjs', '.svelte', '.json', '.md', '.html']);"
          if text.count(old) != 1:
              raise SystemExit(f'expected one build textExtensions declaration, found {text.count(old)}')
          target.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node --check scripts/build-isauto-varna.mjs
      - name: Commit generator CSS boundary fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build-isauto-varna.mjs
          git commit -m 'Keep IS AUTO generator out of template CSS'
          git push origin HEAD:main
