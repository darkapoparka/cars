name: Patch refresh CSS boundary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-refresh-css-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            scripts/lib/client-refresh-adapters.mjs
      - name: Keep dealer text replacement out of stylesheets
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          target = Path('scripts/lib/client-refresh-adapters.mjs')
          text = target.read_text(encoding='utf-8').replace('\r\n', '\n')
          old = "const textExtensions = new Set(['.js', '.mjs', '.cjs', '.ts', '.tsx', '.svelte', '.css', '.html', '.json']);"
          new = "const textExtensions = new Set(['.js', '.mjs', '.cjs', '.ts', '.tsx', '.svelte', '.html', '.json']);"
          if text.count(old) != 1:
              raise SystemExit(f'expected one textExtensions declaration, found {text.count(old)}')
          target.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node --check scripts/lib/client-refresh-adapters.mjs
      - name: Commit CSS boundary fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/lib/client-refresh-adapters.mjs
          git commit -m 'Keep dealer refresh out of template CSS'
          git push origin HEAD:main
