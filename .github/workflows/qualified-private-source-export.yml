name: Qualified private dealer source export
on:
  push:
    branches: [main]
    paths: [docs/releases/cloudflare-existing25-20261011/private-source-export-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: cars-private-source-packaging
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  plan:
    if: github.repository == 'darkapoparka/cars' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /docs/releases/cloudflare-existing25-20261011/private-source-export-request.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - run: node --test scripts/package-qualified-private-source.test.mjs
      - id: plan
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          import {validatePrivateSourceRequest} from './scripts/package-qualified-private-source.mjs';
          const r=validatePrivateSourceRequest(JSON.parse(fs.readFileSync('docs/releases/cloudflare-existing25-20261011/private-source-export-request.json')));
          console.log('matrix='+JSON.stringify({include:r.dealers.map(d=>({...d,sourceCommit:r.sourceCommit,runId:r.runId,attempt:r.attempt}))}));
          NODE
  package_source:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      NODE_OPTIONS: --max-old-space-size=4608
      NEXT_TELEMETRY_DISABLED: '1'
      DEALER: ${{ matrix.slug }}
      SOURCE_RUN: ${{ matrix.runId }}
      SOURCE_COMMIT: ${{ matrix.sourceCommit }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /docs/DEPLOYMENT-INVENTORY.json
            /docs/releases/**/*.json
            /docs/releases/cloudflare-existing25-20261011/new-source/${{ matrix.slug }}/
            /templates.lock.json
            /clients/index.json
            /clients/${{ matrix.slug }}/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Verify original successful run without rerunning it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch('https://api.github.com/repos/darkapoparka/cars/actions/runs/'+process.env.SOURCE_RUN,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if(!r.ok)throw Error('Original run metadata unavailable: '+r.status);
          const j=await r.json();
          if(j.head_sha!==process.env.SOURCE_COMMIT||j.status!=='completed'||j.conclusion!=='success'||j.event!=='push'||j.repository.full_name!=='darkapoparka/cars')throw Error('Original run is not the exact successful source build');
          console.log('Reusing successful source run '+j.id+' at '+j.head_sha);
          NODE
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.runId }}
          pattern: existing-cf-${{ matrix.slug }}-*-${{ matrix.runId }}-${{ matrix.attempt }}
          path: runtime/private-source-inputs/${{ matrix.slug }}
      - name: Install pinned source-only media tooling
        run: |
          mkdir -p runtime/varna-tools
          printf '{"private":true}\n' > runtime/varna-tools/package.json
          npm install --prefix runtime/varna-tools --ignore-scripts --save-exact sharp@0.35.5 typescript@6.0.3
      - name: Seal complete private source and compact immutable object delta
        run: node scripts/package-qualified-private-source.mjs docs/releases/cloudflare-existing25-20261011/private-source-export-request.json runtime/private-source-inputs/$DEALER runtime/private-source-exports/$DEALER $DEALER
      - name: End historical-source Git authentication before artifact upload
        if: always() && steps.checkout.outcome == 'success'
        run: |
          credentials_config="$(git config --local --no-includes --get "includeIf.gitdir:$GITHUB_WORKSPACE/.git.path")"
          [[ "${credentials_config%/*}" == "$RUNNER_TEMP" && "${credentials_config##*/}" =~ ^git-credentials-[0-9a-f-]+\.config$ ]] || exit 1
          git config --file "$credentials_config" --unset-all http.https://github.com/.extraheader
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-source-package-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/private-source-exports/${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
