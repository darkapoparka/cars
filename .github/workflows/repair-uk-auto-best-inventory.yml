name: Repair existing UK Auto Best inventory contracts
on:
  workflow_dispatch:
    inputs:
      dealer:
        description: Repair the two existing dealer sources after verifying their exact source seals
        required: true
        type: choice
        default: all
        options:
          - all
permissions:
  contents: read
concurrency:
  group: cars-uk-dealer-source-creation
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'darkapoparka/cars' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dealer:
          - stockport-broadbent-car-and-servicing
          - batley-as-motor-group
    name: Repair ${{ matrix.dealer }} Auto Best inventory
    steps:
      - name: Check out the exact source and reviewed repair implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /.gitignore
            /.gitattributes
            /package.json
            /package-lock.json
            /templates.lock.json
            /catalog.json
            /workspace.json
            /scripts/
            /.github/workflows/
            /docs/
            /leads/uk-2026-10-10-build-manifest.json
            /leads/uk-2026-10-10-briefs/
            /clients/${{ matrix.dealer }}/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify six sources, repair inventory exports, reseal and push scoped source
        env:
          UK_DEALER_SLUG: ${{ matrix.dealer }}
        run: node scripts/repair-uk-auto-best-inventory.mjs "$UK_DEALER_SLUG"
      - name: Retain actual source verification and commit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uk-auto-best-inventory-repair-${{ matrix.dealer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/uk-auto-best-inventory-repair/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
