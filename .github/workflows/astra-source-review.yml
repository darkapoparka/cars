name: Astra isolated source review
on:
  push:
    branches: [astra]
    paths: [.github/workflows/astra-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            templates/auto-best/src
            templates/auto-best/scripts
            templates/modern/apps/web
            templates/modern/packages
            templates/modern/scripts
            templates/carwow/src
            templates/carwow/scripts
            templates/showroom/src/lib/data
      - name: Archive text sources only
        shell: bash
        run: |
          mkdir -p /tmp/astra-source
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path.cwd()
          destination = Path('/tmp/astra-source')
          allowed = {'.svelte', '.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs', '.json', '.css', '.html', '.md', '.yaml', '.yml', '.ps1'}
          excluded = {'node_modules', '.git', '.next', '.svelte-kit', 'static', 'public', 'snapshots', '.template', 'audits'}
          for source in root.rglob('*'):
              relative = source.relative_to(root)
              if source.is_file() and source.suffix in allowed and not any(part in excluded for part in relative.parts):
                  target = destination / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astra-source-review
          path: /tmp/astra-source
          retention-days: 1
          include-hidden-files: false
