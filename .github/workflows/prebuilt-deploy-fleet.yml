name: Deploy reviewed dealer package with prebuilt output

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/prebuilt-deploy-fleet.yml

permissions:
  contents: read

concurrency:
  group: prebuilt-deploy-fleet
  cancel-in-progress: false

jobs:
  deploy:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slug: al-basma-motors
            projectId: prj_axqFQFzpsq6JLTBwXOzyv5Wnbphk
            projectName: cars-albasmamotors
            repositoryName: cars-albasmamotors
            dealerSha: 0cf4e3573ae657781ec53cdb79baecb1189a2bfb
            alias: cars-albasmamotors.vercel.app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact reviewed Cars release
        uses: actions/checkout@v4
        with:
          ref: c0aaf94888daddc0457e56d3b5dd48b8018d1372
          fetch-depth: 1
          sparse-checkout: |
            clients/${{ matrix.slug }}
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24.8.0'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Bind existing Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "clients/${{ matrix.slug }}/.vercel"
          printf '%s\n' '{"orgId":"team_RTNXBnClGWDdcYFFUW0BnqvJ","projectId":"${{ matrix.projectId }}"}' \
            > "clients/${{ matrix.slug }}/.vercel/project.json"
      - name: Pull production settings and build locally
        shell: bash
        working-directory: clients/${{ matrix.slug }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production \
            --scope=tyj5 --token="$VERCEL_TOKEN"
          vercel build --prod --scope=tyj5 --token="$VERCEL_TOKEN"

      - name: Upload prebuilt production deployment
        id: deploy
        shell: bash
        working-directory: clients/${{ matrix.slug }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --yes \
            --scope=tyj5 --token="$VERCEL_TOKEN" \
            --meta githubCommitSha=${{ matrix.dealerSha }} \
            --meta githubCommitRef=main \
            --meta githubRepo=${{ matrix.repositoryName }} \
            --meta githubOrg=darkapoparka \
            --meta githubCommitMessage='Publish Cars contact-localization release')"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $deployment_url"
      - name: Verify deployment and production alias
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          vercel inspect "$DEPLOYMENT_URL" --wait --timeout=20m \
            --scope=tyj5 --token="$VERCEL_TOKEN"
          for attempt in $(seq 1 30); do
            root_code="$(curl -L -sS -o /tmp/root.html -w '%{http_code}' \
              --max-time 30 "https://${{ matrix.alias }}/" || true)"
            contact_code="$(curl -L -sS -o /tmp/contact.html -w '%{http_code}' \
              --max-time 30 "https://${{ matrix.alias }}/contact?locale=en" || true)"
            if [ "$root_code" = 200 ] && [ "$contact_code" = 200 ]; then
              grep -q '<html' /tmp/root.html
              echo "Verified https://${{ matrix.alias }}/"
              exit 0
            fi
            sleep 5
          done
          echo 'Production alias did not expose the prebuilt deployment.' >&2
          exit 1
