name: Existing dealer Cloudflare pilot
on:
  push:
    branches: [codex/cloudflare-existing25-20261011]
    paths: [docs/releases/cloudflare-existing25-20261011/build-request.json]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: cars-existing25-cloudflare-builds
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'darkapoparka/cars' && github.ref == 'refs/heads/codex/cloudflare-existing25-20261011'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /docs/releases/cloudflare-existing25-20261011/selection.json
            /docs/releases/cloudflare-existing25-20261011/build-request.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --test scripts/client-logo-contract.test.mjs scripts/dealer-reference-package.test.mjs scripts/modern-demo-database.test.mjs scripts/existing-fleet-cloudflare.test.mjs scripts/dealer-presentation.test.mjs
      - id: matrix
        run: node scripts/build-existing-fleet-cloudflare.mjs matrix >> "$GITHUB_OUTPUT"
  compile:
    needs: plan
    name: ${{ matrix.slug }} / ${{ matrix.key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DEALER_SLUG: ${{ matrix.slug }}
      DEALER_FAMILY: ${{ matrix.key }}
      NODE_OPTIONS: --max-old-space-size=4608
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /docs/releases/cloudflare-existing25-20261011/selection.json
            /docs/releases/cloudflare-existing25-20261011/build-request.json
            /clients/${{ matrix.slug }}/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install pinned share tooling without Cloudflare credentials
        run: |
          mkdir -p runtime/varna-tools
          printf '{"private":true}\n' > runtime/varna-tools/package.json
          npm install --prefix runtime/varna-tools --ignore-scripts --save-exact sharp@0.35.5 typescript@6.0.3
      - name: Compile current dealer with maintained native Cloudflare adapters
        run: node scripts/build-existing-fleet-cloudflare.mjs compile "$DEALER_SLUG" "$DEALER_FAMILY"
      - name: Retain exact compiled Worker, assets, locks and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: existing-cf-${{ matrix.slug }}-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/existing-fleet-cloudflare/${{ matrix.slug }}/${{ matrix.key }}/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
