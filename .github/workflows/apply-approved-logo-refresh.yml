name: Apply approved dealer logo refresh

on:
  push:
    branches: [main]
    paths:
      - 'docs/logo-refresh/2026-09-18/IDENTITY_DECISIONS.json'
      - 'docs/logo-refresh/2026-09-18/tools/build-approved-logo-pack.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: approved-logo-refresh
  cancel-in-progress: false

jobs:
  render:
    name: Render ${{ matrix.client }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        client:
          - isauto-varna
          - champion-auto-pro
          - perfect-auto-varna
          - kg-team-auto
          - legend-auto
          - ivo-auto
          - asko-96
          - outletcars-varna
          - promosale-varna
          - navara-car
          - al-hamoor-al-thahabi
          - texas-drive-auto
          - eliqauto
          - the-dealers-point
          - f1rst-motors
          - al-basma-motors
          - elit-auto-import
          - automarket-varna
          - priselci
          - autolife
          - astracar
          - avangard-auto
          - excellent-cars
    steps:
      - name: Check out one canonical dealer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/logo-refresh/2026-09-18/IDENTITY_DECISIONS.json
            /docs/logo-refresh/2026-09-18/tools/build-approved-logo-pack.mjs
            /clients/${{ matrix.client }}/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install isolated image tooling
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/cars-logo-tools" sharp@0.35.1 --no-audit --no-fund

      - name: Build exact approved raster pack
        shell: bash
        env:
          CLIENT: ${{ matrix.client }}
          CARS_SHARP_ROOT: ${{ runner.temp }}/cars-logo-tools
        run: |
          set -euo pipefail
          node --check docs/logo-refresh/2026-09-18/tools/build-approved-logo-pack.mjs
          node docs/logo-refresh/2026-09-18/tools/build-approved-logo-pack.mjs \
            --client "$CLIENT" \
            --decisions docs/logo-refresh/2026-09-18/IDENTITY_DECISIONS.json

      - name: Enforce logo-only change boundary
        shell: bash
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          set -euo pipefail
          git add --sparse -A "clients/${CLIENT}"
          mapfile -t changed < <(git diff --cached --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No logo changes produced for ${CLIENT}." >&2
            exit 1
          fi
          for file in "${changed[@]}"; do
            case "$file" in
              "clients/${CLIENT}/business-facts.json"|\
              "clients/${CLIENT}/assets/brand/"*|\
              "clients/${CLIENT}/auto-best/static/assets/brand/"*|\
              "clients/${CLIENT}/modern/apps/web/public/assets/brand/"*|\
              "clients/${CLIENT}/carwow/static/assets/brand/"*|\
              "clients/${CLIENT}/import/static/assets/brand/"*|\
              "clients/${CLIENT}/auto-best/src/lib/config/brand.ts"|\
              "clients/${CLIENT}/modern/packages/marketplace/lead-site.ts"|\
              "clients/${CLIENT}/carwow/src/lib/data/daynight-site.ts"|\
              "clients/${CLIENT}/import/src/lib/data/daynight.ts") ;;
              *) echo "Protected non-logo file changed: $file" >&2; exit 1 ;;
            esac
          done
          mkdir -p "$RUNNER_TEMP/logo-overlay"
          git diff --cached --name-only -z | tar --null -T - -czf "$RUNNER_TEMP/logo-overlay/${CLIENT}.tar.gz"
          git diff --cached --stat

      - name: Upload reviewed overlay
        uses: actions/upload-artifact@v4
        with:
          name: client-logo-refresh-${{ matrix.client }}
          path: ${{ runner.temp }}/logo-overlay/${{ matrix.client }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  commit:
    name: Commit canonical reviewed packs
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /clients/
            /docs/logo-refresh/2026-09-18/IDENTITY_DECISIONS.json

      - name: Download all reviewed overlays
        uses: actions/download-artifact@v4
        with:
          pattern: client-logo-refresh-*
          path: ${{ runner.temp }}/logo-overlays

      - name: Apply overlays and commit main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/logo-overlays" -name '*.tar.gz' -print0 | sort -z | while IFS= read -r -d '' archive; do
            tar -xzf "$archive" -C "$GITHUB_WORKSPACE"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A clients
          if git diff --cached --quiet; then
            echo 'No canonical logo changes to commit.' >&2
            exit 1
          fi
          git commit -m "Apply approved contextual logo packs to 23 dealers"
          git push origin HEAD:main
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "Canonical source commit: ${source_sha}"

  build_package:
    name: Build/package ${{ matrix.client }}
    needs: commit
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        client:
          - isauto-varna
          - champion-auto-pro
          - perfect-auto-varna
          - kg-team-auto
          - legend-auto
          - ivo-auto
          - asko-96
          - outletcars-varna
          - promosale-varna
          - navara-car
          - al-hamoor-al-thahabi
          - texas-drive-auto
          - eliqauto
          - the-dealers-point
          - f1rst-motors
          - al-basma-motors
          - elit-auto-import
          - automarket-varna
          - priselci
          - autolife
          - astracar
          - avangard-auto
          - excellent-cars
    steps:
      - name: Check out exact canonical source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.commit.outputs.source_sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /catalog.json
            /templates.lock.json
            /docs/
            /scripts/
            /templates/auto-best/
            /templates/modern/
            /templates/carwow/
            /templates/import/
            /clients/${{ matrix.client }}/

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'

      - name: Verify protected template composition
        shell: bash
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { assertTemplatePresentation } from './scripts/lib/client-refresh-presentation.mjs';
          const root = process.cwd();
          const client = process.env.CLIENT;
          for (const key of ['auto-best', 'modern', 'carwow']) {
            const candidate = path.join(root, 'clients', client, key);
            if (!fs.existsSync(candidate)) throw new Error(`${client}: missing required ${key} design.`);
            assertTemplatePresentation({ key, template: path.join(root, 'templates', key), candidate });
          }
          for (const variant of [
            ['auto-best', 'static'],
            ['modern', 'apps/web/public'],
            ['carwow', 'static']
          ]) {
            const base = path.join(root, 'clients', client, variant[0], variant[1], 'assets', 'brand');
            for (const name of ['logo-master.png', 'logo-on-light.webp', 'logo-on-dark.webp', 'logo-implementation.json']) {
              if (!fs.existsSync(path.join(base, name))) throw new Error(`${client}/${variant[0]}: missing ${name}`);
            }
          }
          console.log(`${client}: template composition and contextual raster pack verified.`);
          NODE

      - name: Build Auto Best
        working-directory: clients/${{ matrix.client }}/auto-best
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check --if-present
          npm run check:assets --if-present
          npm run build

      - name: Build Modern
        working-directory: clients/${{ matrix.client }}/modern
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @repo/database build
          pnpm --filter web build

      - name: Build Carwow
        working-directory: clients/${{ matrix.client }}/carwow
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check --if-present
          npm run build

      - name: Clean ignored outputs and package exact source
        shell: bash
        env:
          CLIENT: ${{ matrix.client }}
          SOURCE_SHA: ${{ needs.commit.outputs.source_sha }}
        run: |
          set -euo pipefail
          git clean -fdX -- "clients/${CLIENT}"
          rm -rf "runtime/dealer-packages/${CLIENT}"
          node scripts/package-dealer.mjs \
            --client "$CLIENT" \
            --out "runtime/dealer-packages/${CLIENT}" \
            --source-commit "$SOURCE_SHA" \
            --write

      - name: Publish deterministic package branch
        id: package
        shell: bash
        env:
          CLIENT: ${{ matrix.client }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE/runtime/dealer-packages/${CLIENT}"
          publish_dir="$RUNNER_TEMP/${CLIENT}-publish"
          package_branch="publish/${CLIENT}"
          mkdir -p "$publish_dir"
          cd "$publish_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin "refs/heads/${package_branch}"; then
            git checkout -B "$package_branch" FETCH_HEAD
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            git checkout --orphan "$package_branch"
          fi
          cp -a "$package"/. .
          git add -A
          if git diff --cached --quiet; then
            echo "Package already matches ${SOURCE_SHA}."
          else
            git commit -m "Publish approved logo refresh for ${CLIENT} from ${SOURCE_SHA}"
            git push origin "HEAD:refs/heads/${package_branch}"
          fi
          package_sha="$(git rev-parse HEAD)"
          printf '{\n  "client": "%s",\n  "sourceSha": "%s",\n  "packageBranch": "%s",\n  "packageSha": "%s"\n}\n' \
            "$CLIENT" "$SOURCE_SHA" "$package_branch" "$package_sha" > "$RUNNER_TEMP/package-meta.json"
          echo "package_sha=${package_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload build/package result
        uses: actions/upload-artifact@v4
        with:
          name: approved-logo-package-${{ matrix.client }}
          path: ${{ runner.temp }}/package-meta.json
          if-no-files-found: error
          retention-days: 14
