name: Logo refresh live audit

on:
  push:
    branches:
      - logo-refresh-live-audit-2026-09-18
    paths:
      - .github/workflows/logo-refresh-live-audit.yml
      - scripts/logo-refresh-audit.mjs
      - scripts/logo-refresh-dealers.json

concurrency:
  group: logo-refresh-live-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows/logo-refresh-live-audit.yml
            scripts/logo-refresh-audit.mjs
            scripts/logo-refresh-dealers.json
            qa-output
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install audit dependencies
        run: |
          mkdir -p logo-audit-runtime
          cd logo-audit-runtime
          npm init -y
          npm install playwright@1.55.0 sharp@0.34.3
          npx playwright install --with-deps chromium
          cd ..
          ln -s logo-audit-runtime/node_modules node_modules

      - name: Normalize routes and parallelize live audit
        run: |
          sed -i 's#"/auto-best/"#"/"#g; s#"/modern/"#"/variant-2/"#g; s#"/carwow/"#"/variant-3/"#g' scripts/logo-refresh-dealers.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/logo-refresh-audit.mjs')
          text = p.read_text('utf-8')
          text = text.replace("waitUntil: 'networkidle', timeout: 75000", "waitUntil: 'domcontentloaded', timeout: 15000")
          text = text.replace('await page.waitForTimeout(3000);', 'await page.waitForTimeout(800);')
          text = text.replace('await page.waitForTimeout(1200);', 'await page.waitForTimeout(350);')
          start = text.index('const summary = {')
          marker = "console.log('Audit complete.');"
          end = text.index(marker, start) + len(marker)
          replacement = r'''const summary = {
            generatedAt: new Date().toISOString(),
            purpose: 'Pre-change desktop/mobile live logo audit for the 24 handoff projects',
            dealers: new Array(dealers.length)
          };
          let nextIndex = 0;
          async function worker() {
            while (true) {
              const index = nextIndex++;
              if (index >= dealers.length) return;
              const dealer = dealers[index];
              console.log(`[${index + 1}/${dealers.length}] ${dealer.project}`);
              const item = { project: dealer.project, name: dealer.name, strategyFromHandoff: dealer.strategy };
              try {
                item.live = await auditDealer(browser, dealer);
              } catch (error) {
                item.liveError = String(error);
              }
              summary.dealers[index] = item;
            }
          }
          await Promise.all(Array.from({ length: 4 }, () => worker()));
          await browser.close();
          await writeJson(path.join(out, 'audit.json'), summary);
          console.log('Audit complete.');'''
          p.write_text(text[:start] + replacement + text[end:], 'utf-8')
          PY

      - name: Run live audit
        run: node scripts/logo-refresh-audit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse qa-output
          git commit -m "chore(qa): capture pre-change logo audit" || exit 0
          git push
