name: Logo refresh live audit

on:
  push:
    branches:
      - logo-refresh-live-audit-2026-09-18
    paths:
      - .github/workflows/logo-refresh-live-audit.yml
      - scripts/logo-refresh-audit.mjs
      - scripts/logo-refresh-dealers.json

concurrency:
  group: logo-refresh-live-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows/logo-refresh-live-audit.yml
            scripts/logo-refresh-audit.mjs
            scripts/logo-refresh-dealers.json
            qa-output
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install audit dependencies
        run: |
          mkdir -p logo-audit-runtime
          cd logo-audit-runtime
          npm init -y
          npm install playwright@1.55.0 sharp@0.34.3
          npx playwright install --with-deps chromium
          cd ..
          ln -s logo-audit-runtime/node_modules node_modules

      - name: Normalize live routes and navigation timing
        run: |
          sed -i 's#"/auto-best/"#"/"#g; s#"/modern/"#"/variant-2/"#g; s#"/carwow/"#"/variant-3/"#g' scripts/logo-refresh-dealers.json
          sed -i "s/waitUntil: 'networkidle', timeout: 75000/waitUntil: 'domcontentloaded', timeout: 30000/g" scripts/logo-refresh-audit.mjs

      - name: Run live and asset audit
        run: node scripts/logo-refresh-audit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse qa-output
          git commit -m "chore(qa): capture pre-change logo audit" || exit 0
          git push
