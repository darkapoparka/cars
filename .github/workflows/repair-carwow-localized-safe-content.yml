name: Repair Carwow localized safe content

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-carwow-localized-safe-content.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-carwow-localized-safe-content-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out canonical Cars source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/repair-carwow-localized-safe-content.yml
            /scripts/

      - uses: actions/setup-node@v4
        with:
          node-version: '24.8.0'

      - name: Repair catalog-safe generated review disclosure
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'scripts/lib/client-refresh-safe-content.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const pattern = /export const daynightReviewDisclosure = \$\{q\(english[\s\S]*?\)\} as const;/;
          const replacement = "export const daynightReviewDisclosure = ${q('Демонстрационни отзиви и оценки. Не са потвърдени клиентски мнения.')} as const;";
          if (!pattern.test(source)) throw new Error('Cannot locate generated Carwow review disclosure');
          source = source.replace(pattern, replacement);
          fs.writeFileSync(file, source);

          fs.writeFileSync('scripts/client-refresh-safe-content.test.mjs', `import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { applyCarwowSafeContent } from './lib/client-refresh-safe-content.mjs';

          const profile = (countryCode) => ({
            business: {
              countryCode,
              shortName: 'Fixture Auto',
              name: 'Fixture Auto',
              phoneDisplay: '+359 88 000 0000',
              email: 'fixture@example.com',
              observedAt: '2026-09-21',
              city: 'Sofia',
              address: 'Fixture Street 1',
              inventoryNotice: 'Confirm current inventory.',
              previewNotice: 'Independent demonstration.'
            }
          });

          for (const countryCode of ['BG', 'AE']) {
            test('Carwow safe review copy is catalog-backed for ' + countryCode, () => {
              const candidate = fs.mkdtempSync(path.join(os.tmpdir(), 'cars-safe-copy-'));
              applyCarwowSafeContent({ candidate, profile: profile(countryCode), logo: '/dealer-brand/logo.webp' });
              const generated = fs.readFileSync(path.join(candidate, 'src/lib/data/daynight-reviews.ts'), 'utf8');
              assert.match(generated, /Демонстрационни отзиви и оценки\. Не са потвърдени клиентски мнения\./);
              assert.doesNotMatch(generated, /No verified customer reviews are included in this independent preview/);
              assert.doesNotMatch(generated, /В този независим преглед не са включени потвърдени клиентски отзиви/);
            });
          }
          `);
          NODE
          node --test scripts/client-refresh-safe-content.test.mjs
          node --test scripts/dealer-localized-copy.test.mjs

      - name: Commit canonical repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-carwow-localized-safe-content.yml
          git add --sparse scripts/lib/client-refresh-safe-content.mjs scripts/client-refresh-safe-content.test.mjs
          git diff --cached --check
          git commit -m 'Keep generated Carwow review copy catalog-safe' -m 'Use the reviewed template source for generated empty-review disclosures and cover Bulgarian and international dealer fixtures.'
          git pull --rebase origin main
          git push origin HEAD:main
