name: Verify Auto Best 0.2.0 dealer fleet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-localized-fleet.yml'

permissions:
  contents: read

concurrency:
  group: deploy-corrected-localized-dealer-fleet
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/DEPLOYMENT-INVENTORY.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24.8.0'

      - name: Verify all 25 production aliases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const inventory = JSON.parse(fs.readFileSync('docs/DEPLOYMENT-INVENTORY.json', 'utf8'));
          const requested = new Set([
            'al-basma-motors','al-hamoor-al-thahabi','al-reef-used-cars','asko-96','astracar','autolife',
            'automarket-varna','avangard-auto','champion-auto-pro','day-and-night-auto-group',
            'eliqauto','elit-auto-import','excellent-cars','f1rst-motors','isauto-varna',
            'ivo-auto','kg-team-auto','legend-auto','navara-car','outletcars-varna',
            'perfect-auto-varna','priselci','promosale-varna','texas-drive-auto','the-dealers-point'
          ]);
          const rows = inventory.dealers
            .filter((dealer) => requested.has(dealer.slug))
            .map((dealer) => ({
              slug: dealer.slug,
              name: dealer.name || dealer.slug,
              projectId: dealer.delivery?.projectId || null,
              alias: (dealer.delivery?.url || '').replace(/\/$/, '')
            }));
          const missing = [...requested].filter((slug) => !rows.some((row) => row.slug === slug));
          const invalid = rows.filter((row) => !/^https:\/\//.test(row.alias));
          if (missing.length || invalid.length || rows.length !== requested.size) {
            throw new Error(`Fleet inventory mismatch. missing=${missing.join(',')} invalid=${invalid.map((row) => row.slug).join(',')} rows=${rows.length}`);
          }

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const decode = (value) => value
            .replaceAll('&amp;', '&').replaceAll('&quot;', '"').replaceAll('&#39;', "'")
            .replaceAll('&lt;', '<').replaceAll('&gt;', '>').replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)));
          const plain = (html) => decode(html.replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' ')).replace(/\s+/g, ' ').trim();
          const request = async (url) => {
            try {
              const response = await fetch(url, {
                redirect: 'follow',
                signal: AbortSignal.timeout(30000),
                headers: { 'user-agent': 'cars-autobest-fleet-verifier/2.0', 'accept-language': 'en' }
              });
              const text = await response.text();
              return { status: response.status, finalUrl: response.url, text, headers: Object.fromEntries(response.headers), error: null };
            } catch (error) {
              return { status: 0, finalUrl: url, text: '', headers: {}, error: String(error) };
            }
          };
          const mapLimit = async (items, limit, worker) => {
            const output = new Array(items.length);
            let next = 0;
            await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
              while (true) {
                const index = next++;
                if (index >= items.length) return;
                output[index] = await worker(items[index]);
              }
            }));
            return output;
          };
          const logoPath = (html) => {
            const candidates = [...html.matchAll(/<img\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi)]
              .map((match) => decode(match[1]))
              .filter((src) => /\.(?:png|webp)(?:[?#]|$)/i.test(src) && /(?:logo|wordmark|dealer-brand|dealer\/brand|\/navara\/)/i.test(src));
            return candidates[0] || '';
          };
          const verify = async (dealer) => {
            const locales = {};
            for (const locale of ['en', 'bg']) {
              const page = await request(`${dealer.alias}/${locale}`);
              const body = plain(page.text).toLocaleLowerCase(locale === 'bg' ? 'bg-BG' : 'en-US');
              const expectedName = dealer.name.toLocaleLowerCase(locale === 'bg' ? 'bg-BG' : 'en-US');
              locales[locale] = {
                status: page.status,
                finalUrl: page.finalUrl,
                language: new RegExp(`<html[^>]*\\blang=["']?${locale}\\b`, 'i').test(page.text),
                localeUi: /cars-locale-dialog|data-locale-dialog/.test(page.text) && page.text.includes('English') && page.text.includes('Български'),
                releaseArtwork: page.text.includes('/assets/images/template/service-sell-front-v3.webp') && page.text.includes('/assets/images/template/service-import-front-v3.webp'),
                vehicleTypeContract: /<option\s+value=["']motorbike["']/.test(page.text) && /<option\s+value=["']truck["']/.test(page.text),
                dealerIdentity: body.includes(expectedName),
                logo: logoPath(page.text),
                error: page.error
              };
            }
            const logo = locales.en.logo || locales.bg.logo;
            let logoCheck = { path: logo, status: 0, contentType: '', raster: /\.(?:png|webp)(?:[?#]|$)/i.test(logo), error: null };
            if (logo) {
              const target = new URL(logo, `${dealer.alias}/`).href;
              try {
                const response = await fetch(target, { redirect: 'follow', signal: AbortSignal.timeout(30000), headers: { 'user-agent': 'cars-autobest-fleet-verifier/2.0' } });
                logoCheck = { ...logoCheck, status: response.status, contentType: response.headers.get('content-type') || '', finalUrl: response.url };
                await response.body?.cancel();
              } catch (error) {
                logoCheck.error = String(error);
              }
            }
            const routePass = Object.values(locales).every((item) => item.status === 200 && item.language && item.localeUi && item.releaseArtwork && item.vehicleTypeContract && item.dealerIdentity && item.logo);
            const logoPass = logoCheck.status === 200 && logoCheck.raster && /^image\//i.test(logoCheck.contentType);
            return { ...dealer, pass: routePass && logoPass, locales, logo: logoCheck };
          };

          let report = null;
          for (let attempt = 1; attempt <= 80; attempt += 1) {
            const dealers = await mapLimit(rows, 6, verify);
            report = {
              schemaVersion: 1,
              release: {
                version: '0.2.0',
                autoBestCommit: 'b9ed9beee33c1bcc3278959a2f4cd351b04e87f0',
                sourceTree: 'bbc9c91c017d7d2d562ad68cf1a0931c11289417',
                sourceDigest: 'b98e011d45774f69b18a1ff69e9e42f58ad690d7cf1acbb7e56ea83303529c42'
              },
              attempt,
              checkedAt: new Date().toISOString(),
              passed: dealers.filter((dealer) => dealer.pass).length,
              failed: dealers.filter((dealer) => !dealer.pass).length,
              dealers
            };
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'evidence/auto-best-0.2.0-fleet.json'), JSON.stringify(report, null, 2));
            const pending = dealers.filter((dealer) => !dealer.pass).map((dealer) => dealer.slug);
            console.log(`attempt=${attempt} passed=${report.passed}/25 pending=${pending.join(',') || 'none'}`);
            if (!pending.length) break;
            if (attempt < 80) await sleep(15000);
          }
          if (!report || report.failed) {
            console.error(JSON.stringify(report?.dealers.filter((dealer) => !dealer.pass) || [], null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({ checkedAt: report.checkedAt, passed: report.passed, release: report.release }, null, 2));
          NODE

      - name: Upload fleet verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-best-0.2.0-production-fleet
          path: ${{ runner.temp }}/evidence/auto-best-0.2.0-fleet.json
          if-no-files-found: error
          retention-days: 30
